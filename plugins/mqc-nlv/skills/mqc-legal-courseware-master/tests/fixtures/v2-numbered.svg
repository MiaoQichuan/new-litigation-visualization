<rect x="24.0" y="78.0" width="300.0" height="49" rx="12" fill="#F3F4F6" stroke="#D6DAE0" stroke-width="1"/>
<text x="174.0" y="98.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2015.05.12</text>
<text x="174.0" y="116.0" font-size="13" fill="#1F2933" text-anchor="middle">丙公司向员工G、员工H转账4万元及9300元</text>
<rect x="376.0" y="113.0" width="300.0" height="49" rx="12" fill="#F3F4F6" stroke="#D6DAE0" stroke-width="1"/>
<text x="526.0" y="133.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2019.11.29</text>
<text x="526.0" y="151.0" font-size="13" fill="#1F2933" text-anchor="middle">甲公司与丙公司签署《合作经营合同》</text>
<rect x="24.0" y="147.0" width="300.0" height="49" rx="12" fill="#FFFFFF" stroke="#D6DAE0" stroke-width="1" stroke-dasharray="6 4"/>
<text x="174.0" y="167.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2021年</text>
<text x="174.0" y="185.0" font-size="13" fill="#1F2933" text-anchor="middle">丙公司起诉甲公司与乙公司</text>
<rect x="376.0" y="190.5" width="300.0" height="32" rx="12" fill="#FFFFFF" stroke="#D6DAE0" stroke-width="1" stroke-dasharray="6 4"/>
<text x="526.0" y="211.5" font-size="13" fill="#1F2933" text-anchor="middle">二审判决驳回上诉，维持原判</text>
<rect x="24.0" y="216.0" width="300.0" height="49" rx="12" fill="#F3F4F6" stroke="#D6DAE0" stroke-width="1"/>
<text x="174.0" y="236.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2021.03.26</text>
<text x="174.0" y="254.0" font-size="13" fill="#1F2933" text-anchor="middle">甲公司与丁单位发布职工接转方案通知</text>
<rect x="376.0" y="251.0" width="300.0" height="49" rx="12" fill="#F3F4F6" stroke="#D6DAE0" stroke-width="1"/>
<text x="526.0" y="271.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2021.04.28</text>
<text x="526.0" y="289.0" font-size="13" fill="#1F2933" text-anchor="middle">甲公司书面通知丙公司解除《合作经营合同》</text>
<rect x="24.0" y="285.0" width="300.0" height="49" rx="12" fill="#F3F4F6" stroke="#D6DAE0" stroke-width="1"/>
<text x="174.0" y="305.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2021.04.30</text>
<text x="174.0" y="323.0" font-size="13" fill="#1F2933" text-anchor="middle">各方共同参会并形成会议纪要</text>
<rect x="376.0" y="320.0" width="300.0" height="49" rx="12" fill="#991B1B"/>
<text x="526.0" y="340.0" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">2021.05.17</text>
<text x="526.0" y="358.0" font-size="13" fill="#FFFFFF" text-anchor="middle">甲公司与丙公司签订《借款（垫款）协议》</text>
<rect x="24.0" y="354.0" width="300.0" height="49" rx="12" fill="#F3F4F6" stroke="#D6DAE0" stroke-width="1"/>
<text x="174.0" y="374.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2021.05.17</text>
<text x="174.0" y="392.0" font-size="13" fill="#1F2933" text-anchor="middle">甲公司向丙公司支付首期垫款485000元</text>
<rect x="376.0" y="389.0" width="300.0" height="49" rx="12" fill="#F3F4F6" stroke="#D6DAE0" stroke-width="1"/>
<text x="526.0" y="409.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2021.05.19</text>
<text x="526.0" y="427.0" font-size="13" fill="#1F2933" text-anchor="middle">甲公司向丙公司支付尾款485000元</text>
<rect x="24.0" y="423.0" width="300.0" height="49" rx="12" fill="#FFFFFF" stroke="#D6DAE0" stroke-width="1" stroke-dasharray="6 4"/>
<text x="174.0" y="443.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2021.05.19至21</text>
<text x="174.0" y="461.0" font-size="13" fill="#1F2933" text-anchor="middle">丙公司向员工B转账共计35万元</text>
<rect x="376.0" y="458.0" width="300.0" height="49" rx="12" fill="#F3F4F6" stroke="#D6DAE0" stroke-width="1"/>
<text x="526.0" y="478.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2023.07.29</text>
<text x="526.0" y="496.0" font-size="13" fill="#1F2933" text-anchor="middle">丙公司向员工A转账45000元</text>
<rect x="24.0" y="492.0" width="300.0" height="49" rx="12" fill="#F3F4F6" stroke="#D6DAE0" stroke-width="1"/>
<text x="174.0" y="512.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2024.11.11</text>
<text x="174.0" y="530.0" font-size="13" fill="#1F2933" text-anchor="middle">法院就借款合同纠纷作出民事判决</text>
<rect x="376.0" y="527.0" width="300.0" height="49" rx="12" fill="#F3F4F6" stroke="#D6DAE0" stroke-width="1"/>
<text x="526.0" y="547.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2025.02.24</text>
<text x="526.0" y="565.0" font-size="13" fill="#1F2933" text-anchor="middle">甲公司、乙公司出具沟通函</text>
<rect x="24.0" y="561.0" width="300.0" height="49" rx="12" fill="#F3F4F6" stroke="#D6DAE0" stroke-width="1"/>
<text x="174.0" y="581.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2025.02.27</text>
<text x="174.0" y="599.0" font-size="13" fill="#1F2933" text-anchor="middle">丙公司出具回复函</text>
<rect x="376.0" y="596.0" width="300.0" height="49" rx="12" fill="#F3F4F6" stroke="#D6DAE0" stroke-width="1"/>
<text x="526.0" y="616.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2025.02.28</text>
<text x="526.0" y="634.0" font-size="13" fill="#1F2933" text-anchor="middle">甲公司、乙公司出具相关意见</text>
<rect x="24.0" y="630.0" width="300.0" height="49" rx="12" fill="#F3F4F6" stroke="#D6DAE0" stroke-width="1"/>
<text x="174.0" y="650.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2025.03.05</text>
<text x="174.0" y="668.0" font-size="13" fill="#1F2933" text-anchor="middle">丙公司出具第二次回复函</text>
<rect x="376.0" y="665.0" width="300.0" height="49" rx="12" fill="#F3F4F6" stroke="#D6DAE0" stroke-width="1"/>
<text x="526.0" y="685.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2025.03.06</text>
<text x="526.0" y="703.0" font-size="13" fill="#1F2933" text-anchor="middle">甲公司、乙公司再次出具相关意见</text>
<rect x="24.0" y="699.0" width="300.0" height="49" rx="12" fill="#F3F4F6" stroke="#D6DAE0" stroke-width="1"/>
<text x="174.0" y="719.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2025.03.12</text>
<text x="174.0" y="737.0" font-size="13" fill="#1F2933" text-anchor="middle">甲公司、乙公司至法院立案</text>
<rect x="376.0" y="734.0" width="300.0" height="49" rx="12" fill="#F3F4F6" stroke="#D6DAE0" stroke-width="1"/>
<text x="526.0" y="754.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">2025.03.19</text>
<text x="526.0" y="772.0" font-size="13" fill="#1F2933" text-anchor="middle">本院立案并适用普通程序公开开庭审理</text>
