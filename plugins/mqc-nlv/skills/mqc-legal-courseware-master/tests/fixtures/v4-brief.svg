<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 2100 2970">
<rect width="2100" height="2970" fill="#FFFFFF"/>
<text data-x="1050" data-w="388" data-a="middle" x="856" y="307" font-size="78" fill="#33302C" font-family="方正小标宋简体">案件大事记</text>
<text data-x="1050" data-w="704" data-a="middle" font-size="37" fill="#6B655D"><tspan x="698.1" y="370" font-family="宋体">某某与广州某地产公司商品房买卖合同纠纷</tspan></text>
<rect x="240" y="470" width="1620" height="854" rx="14" fill="none" stroke="#8A8378" stroke-width="3"/>
<text data-x="310" data-w="74" data-a="middle" font-size="37" fill="#33302C" font-weight="700"><tspan x="273.0" y="532" font-family="宋体">序号</tspan></text>
<text data-x="570" data-w="74" data-a="middle" font-size="37" fill="#33302C" font-weight="700"><tspan x="533.0" y="532" font-family="宋体">日期</tspan></text>
<text data-x="990" data-w="74" data-a="middle" font-size="37" fill="#33302C" font-weight="700"><tspan x="953.0" y="532" font-family="宋体">事项</tspan></text>
<text data-x="1540" data-w="148" data-a="middle" font-size="37" fill="#33302C" font-weight="700"><tspan x="1465.9" y="532" font-family="宋体">主要内容</tspan></text>
<line x1="256" y1="566" x2="1844" y2="566" stroke="#8A8378" stroke-width="3"/>
<text data-x="310" data-w="19" data-a="middle" font-size="37" fill="#6B655D"><tspan x="300.4" y="666" font-family="Times New Roman">1</tspan></text>
<text data-x="570" data-w="193" data-a="middle" font-size="37" fill="#6B655D"><tspan x="473.7" y="666" font-family="Times New Roman">2004.04.08</tspan></text>
<text data-x="990" data-w="407" data-a="middle" font-size="37" fill="#33302C" font-weight="700"><tspan x="786.3" y="666" font-family="宋体">签订《商品房买卖合同》</tspan></text>
<text data-x="1240" data-w="600" data-a="start" font-size="37" fill="#6B655D"><tspan x="1240.0" y="620" font-family="宋体">出</tspan><tspan x="1277.5" y="620" font-family="宋体">卖</tspan><tspan x="1315.1" y="620" font-family="宋体">人</tspan><tspan x="1352.6" y="620" font-family="宋体">广</tspan><tspan x="1390.1" y="620" font-family="宋体">州</tspan><tspan x="1427.7" y="620" font-family="宋体">某</tspan><tspan x="1465.2" y="620" font-family="宋体">地</tspan><tspan x="1502.7" y="620" font-family="宋体">产</tspan><tspan x="1540.2" y="620" font-family="宋体">公</tspan><tspan x="1577.8" y="620" font-family="宋体">司</tspan><tspan x="1615.3" y="620" font-family="宋体">与</tspan><tspan x="1652.8" y="620" font-family="宋体">买</tspan><tspan x="1690.4" y="620" font-family="宋体">受</tspan><tspan x="1727.9" y="620" font-family="宋体">人</tspan><tspan x="1765.4" y="620" font-family="宋体">某</tspan><tspan x="1803.0" y="620" font-family="宋体">某</tspan></text>
<text data-x="1240" data-w="600" data-a="start" font-size="37" fill="#6B655D"><tspan x="1240.0" y="666" font-family="宋体">签</tspan><tspan x="1278.3" y="666" font-family="宋体">订</tspan><tspan x="1316.7" y="666" font-family="宋体">，</tspan><tspan x="1355.0" y="666" font-family="宋体">约</tspan><tspan x="1393.4" y="666" font-family="宋体">定</tspan><tspan x="1431.7" y="666" font-family="宋体">建</tspan><tspan x="1470.1" y="666" font-family="宋体">筑</tspan><tspan x="1508.4" y="666" font-family="宋体">面</tspan><tspan x="1546.8" y="666" font-family="宋体">积</tspan><tspan x="1585.1" y="666" font-family="Times New Roman">1</tspan><tspan x="1605.7" y="666" font-family="Times New Roman">2</tspan><tspan x="1626.2" y="666" font-family="Times New Roman">8</tspan><tspan x="1646.8" y="666" font-family="Times New Roman">.</tspan><tspan x="1667.4" y="666" font-family="Times New Roman">6</tspan><tspan x="1687.9" y="666" font-family="宋体">㎡</tspan><tspan x="1726.3" y="666" font-family="宋体">，</tspan><tspan x="1764.6" y="666" font-family="宋体">总</tspan><tspan x="1803.0" y="666" font-family="宋体">价</tspan></text>
<text data-x="1240" data-w="244" data-a="start" font-size="37" fill="#6B655D"><tspan x="1240.0" y="712" font-family="宋体">款</tspan><tspan x="1277.0" y="712" font-family="Times New Roman">1,286</tspan><tspan x="1373.4" y="712" font-family="宋体">万元。</tspan></text>
<line x1="256" y1="744" x2="1844" y2="744" stroke="#D8D3C9" stroke-width="2"/>
<text data-x="310" data-w="19" data-a="middle" font-size="37" fill="#6B655D"><tspan x="300.4" y="821" font-family="Times New Roman">2</tspan></text>
<text data-x="570" data-w="193" data-a="middle" font-size="37" fill="#6B655D"><tspan x="473.7" y="821" font-family="Times New Roman">2004.04.10</tspan></text>
<text data-x="990" data-w="333" data-a="middle" font-size="37" fill="#33302C" font-weight="700"><tspan x="823.3" y="821" font-family="宋体">出具《授权委托书》</tspan></text>
<text data-x="1240" data-w="600" data-a="start" font-size="37" fill="#6B655D"><tspan x="1240.0" y="798" font-family="宋体">委</tspan><tspan x="1277.5" y="798" font-family="宋体">托</tspan><tspan x="1315.1" y="798" font-family="宋体">某</tspan><tspan x="1352.6" y="798" font-family="宋体">某</tspan><tspan x="1390.1" y="798" font-family="宋体">全</tspan><tspan x="1427.7" y="798" font-family="宋体">权</tspan><tspan x="1465.2" y="798" font-family="宋体">办</tspan><tspan x="1502.7" y="798" font-family="宋体">理</tspan><tspan x="1540.2" y="798" font-family="宋体">签</tspan><tspan x="1577.8" y="798" font-family="宋体">约</tspan><tspan x="1615.3" y="798" font-family="宋体">、</tspan><tspan x="1652.8" y="798" font-family="宋体">收</tspan><tspan x="1690.4" y="798" font-family="宋体">款</tspan><tspan x="1727.9" y="798" font-family="宋体">事</tspan><tspan x="1765.4" y="798" font-family="宋体">宜</tspan><tspan x="1803.0" y="798" font-family="宋体">…</tspan></text>
<text data-x="1240" data-w="296" data-a="start" font-size="37" fill="#6B655D"><tspan x="1240.0" y="844" font-family="宋体">…加盖公章一枚。</tspan></text>
<line x1="256" y1="876" x2="1844" y2="876" stroke="#D8D3C9" stroke-width="2"/>
<text data-x="310" data-w="19" data-a="middle" font-size="37" fill="#6B655D"><tspan x="300.4" y="953" font-family="Times New Roman">3</tspan></text>
<text data-x="570" data-w="193" data-a="middle" font-size="37" fill="#6B655D"><tspan x="473.7" y="953" font-family="Times New Roman">2011.03.21</tspan></text>
<text data-x="990" data-w="407" data-a="middle" font-size="37" fill="#33302C" font-weight="700"><tspan x="786.3" y="953" font-family="宋体">作出《司法鉴定意见书》</tspan></text>
<text data-x="1240" data-w="600" data-a="start" font-size="37" fill="#6B655D"><tspan x="1240.0" y="930" font-family="宋体">经</tspan><tspan x="1277.5" y="930" font-family="宋体">鉴</tspan><tspan x="1315.1" y="930" font-family="宋体">定</tspan><tspan x="1352.6" y="930" font-family="宋体">，</tspan><tspan x="1390.1" y="930" font-family="宋体">《</tspan><tspan x="1427.7" y="930" font-family="宋体">授</tspan><tspan x="1465.2" y="930" font-family="宋体">权</tspan><tspan x="1502.7" y="930" font-family="宋体">委</tspan><tspan x="1540.2" y="930" font-family="宋体">托</tspan><tspan x="1577.8" y="930" font-family="宋体">书</tspan><tspan x="1615.3" y="930" font-family="宋体">》</tspan><tspan x="1652.8" y="930" font-family="宋体">上</tspan><tspan x="1690.4" y="930" font-family="宋体">加</tspan><tspan x="1727.9" y="930" font-family="宋体">盖</tspan><tspan x="1765.4" y="930" font-family="宋体">印</tspan><tspan x="1803.0" y="930" font-family="宋体">章</tspan></text>
<text data-x="1240" data-w="296" data-a="start" font-size="37" fill="#6B655D"><tspan x="1240.0" y="976" font-family="宋体">与备案印模不符。</tspan></text>
<line x1="256" y1="1008" x2="1844" y2="1008" stroke="#D8D3C9" stroke-width="2"/>
<text data-x="310" data-w="19" data-a="middle" font-size="37" fill="#6B655D"><tspan x="300.4" y="1085" font-family="Times New Roman">4</tspan></text>
<text data-x="570" data-w="193" data-a="middle" font-size="37" fill="#6B655D"><tspan x="473.7" y="1085" font-family="Times New Roman">2012.06.15</tspan></text>
<text data-x="990" data-w="185" data-a="middle" font-size="37" fill="#33302C" font-weight="700"><tspan x="897.4" y="1085" font-family="宋体">支付工程款</tspan></text>
<text data-x="1240" data-w="600" data-a="start" font-size="37" fill="#6B655D"><tspan x="1240.0" y="1062" font-family="宋体">支</tspan><tspan x="1278.3" y="1062" font-family="宋体">付</tspan><tspan x="1316.7" y="1062" font-family="宋体">幕</tspan><tspan x="1355.0" y="1062" font-family="宋体">墙</tspan><tspan x="1393.4" y="1062" font-family="宋体">工</tspan><tspan x="1431.7" y="1062" font-family="宋体">程</tspan><tspan x="1470.1" y="1062" font-family="宋体">款</tspan><tspan x="1508.4" y="1062" font-family="Times New Roman">1</tspan><tspan x="1529.0" y="1062" font-family="Times New Roman">,</tspan><tspan x="1549.5" y="1062" font-family="Times New Roman">2</tspan><tspan x="1570.1" y="1062" font-family="Times New Roman">0</tspan><tspan x="1590.7" y="1062" font-family="Times New Roman">0</tspan><tspan x="1611.2" y="1062" font-family="宋体">万</tspan><tspan x="1649.6" y="1062" font-family="宋体">元</tspan><tspan x="1687.9" y="1062" font-family="宋体">，</tspan><tspan x="1726.3" y="1062" font-family="宋体">付</tspan><tspan x="1764.6" y="1062" font-family="宋体">款</tspan><tspan x="1803.0" y="1062" font-family="宋体">凭</tspan></text>
<text data-x="1240" data-w="556" data-a="start" font-size="37" fill="#6B655D"><tspan x="1240.0" y="1108" font-family="宋体">证备注栏载明“第三期进度款”。</tspan></text>
<line x1="256" y1="1140" x2="1844" y2="1140" stroke="#D8D3C9" stroke-width="2"/>
<text data-x="310" data-w="19" data-a="middle" font-size="37" fill="#6B655D"><tspan x="300.4" y="1194" font-family="Times New Roman">5</tspan></text>
<text data-x="570" data-w="193" data-a="middle" font-size="37" fill="#6B655D"><tspan x="473.7" y="1194" font-family="Times New Roman">2013.09.02</tspan></text>
<text data-x="990" data-w="259" data-a="middle" font-size="37" fill="#33302C" font-weight="700"><tspan x="860.3" y="1194" font-family="宋体">发出《催告函》</tspan></text>
<text data-x="1240" data-w="593" data-a="start" font-size="37" fill="#6B655D"><tspan x="1240.0" y="1194" font-family="宋体">催告十日内交付，逾期即解除合同。</tspan></text>
<line x1="256" y1="1226" x2="1844" y2="1226" stroke="#D8D3C9" stroke-width="2"/>
<text data-x="310" data-w="19" data-a="middle" font-size="37" fill="#6B655D"><tspan x="300.4" y="1280" font-family="Times New Roman">6</tspan></text>
<text data-x="570" data-w="193" data-a="middle" font-size="37" fill="#6B655D"><tspan x="473.7" y="1280" font-family="Times New Roman">2014.01.20</tspan></text>
<text data-x="990" data-w="259" data-a="middle" font-size="37" fill="#33302C" font-weight="700"><tspan x="860.3" y="1280" font-family="宋体">未办理产权登记</tspan></text>
<text data-x="1240" data-w="519" data-a="start" font-size="37" fill="#6B655D"><tspan x="1240.0" y="1280" font-family="宋体">（未见书证，据当事人陈述）。</tspan></text>
<text data-x="240" data-w="794" data-a="start" font-size="32" fill="#6B655D"><tspan x="240.0" y="2774" font-family="宋体">某某与广州某地产公司商品房买卖合同纠纷　大事记简表</tspan></text>
<text data-x="1860" data-w="276" data-a="end" font-size="32" fill="#6B655D"><tspan x="1584.4" y="2774" font-family="宋体">第 </tspan><tspan x="1632.7" y="2774" font-family="Times New Roman">1 </tspan><tspan x="1665.7" y="2774" font-family="宋体">页 </tspan><tspan x="1713.9" y="2774" font-family="Times New Roman">/ </tspan><tspan x="1747.0" y="2774" font-family="宋体">共 </tspan><tspan x="1795.2" y="2774" font-family="Times New Roman">1 </tspan><tspan x="1828.2" y="2774" font-family="宋体">页</tspan></text>
