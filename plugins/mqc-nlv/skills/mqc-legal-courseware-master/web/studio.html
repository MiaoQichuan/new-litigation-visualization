<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>法律课件大师 · 新诉讼可视化</title>
<link rel="icon" type="image/png" href="/brand/qichuan-favicon.png">
<style>
:root, body[data-style="奇川风"] {
  --acc:#991B1B; --accC:#F7EAEA; --onAccC:#7A1414;
  --bg:#ECEEF1; --panel:#FFFFFF; --tone:#F3F4F6; --tone2:#E9ECEF; --line:#D6DAE0;
  --ink:#1F2933; --ink2:#6B7280; --ink3:#9CA3AF;
  --rs:10px; --rm:16px; --rl:24px; --pill:999px;
}
body[data-style="歸藏风"] {
  --acc:#002FA7; --accC:#E8EDF8; --onAccC:#00227A;
  --bg:#EDEDEB; --panel:#FAFAF8; --tone:#F2F2F0; --tone2:#E8E8E6; --line:#E0E0E0;
  --ink:#333333; --ink2:#737373; --ink3:#BDBDBD;
  --rs:0px; --rm:0px; --rl:0px; --pill:0px;
}
* { box-sizing:border-box }
html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
  font:14px/1.5 "PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif; }
button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
input, textarea, select { font:inherit; color:var(--ink); }
svg.i { width:20px; height:20px; flex:none; }
.app { --rw:64px; --sw:264px; --iw:288px; display:grid; grid-template-columns:var(--rw) var(--sw) minmax(0,1fr) var(--iw); grid-template-rows:minmax(0,100vh); height:100vh; }

/* 左侧导轨 */
.rail { display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 0; }
.logo { width:44px; height:44px; border-radius:var(--rm); background:var(--acc); color:#fff; display:grid; place-items:center;
  font-weight:700; font-size:15px; margin-bottom:12px; }
.rbtn { width:56px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px; color:var(--ink2); padding:4px 0; }
.rbtn .pill { width:52px; height:32px; border-radius:var(--pill); display:grid; place-items:center; transition:background .2s; }
.rbtn:hover .pill { background:var(--tone2); }
.rbtn.on { color:var(--ink); font-weight:600; }
.rbtn.on .pill { background:var(--accC); color:var(--onAccC); }
.rail .grow { flex:1; }

/* 左面板 */
.side { background:var(--panel); border-radius:var(--rl); margin:10px 0; padding:16px 14px; overflow:auto; }
.side h3 { font-size:15px; margin:2px 4px 12px; }
.sec { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink2); margin:16px 4px 8px; letter-spacing:.04em; }
.sec::after { content:""; flex:1; height:1px; background:var(--line); }
.tiles { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.tile { background:var(--tone); border-radius:var(--rm); padding:14px 8px 10px; display:flex; flex-direction:column; align-items:center; gap:6px;
  font-size:12.5px; color:var(--ink); user-select:none; touch-action:none; cursor:grab; transition:background .15s, transform .15s; }
.tile:hover { background:var(--accC); color:var(--onAccC); }
.tile:active { transform:scale(.97); }
.tile small { color:var(--ink2); font-size:11px; margin-top:-4px; }
.asset { display:flex; gap:10px; align-items:center; background:var(--tone); border-radius:var(--rm); padding:10px 12px; margin-bottom:8px;
  cursor:grab; user-select:none; touch-action:none; }
.asset:hover { background:var(--accC); }
.asset .ic { width:36px; height:36px; border-radius:var(--rs); background:var(--panel); display:grid; place-items:center; color:var(--acc); flex:none; }
.asset b { display:block; font-weight:500; font-size:13px; line-height:1.35; }
.asset span { font-size:11.5px; color:var(--ink2); }
.asset.bad { opacity:.55; }
.drop { border:1.5px dashed var(--line); border-radius:var(--rm); padding:14px; text-align:center; color:var(--ink2); font-size:12.5px; margin-top:8px; }
.drop.hot { border-color:var(--acc); color:var(--acc); background:var(--accC); }
.tpls { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tpl { background:var(--tone); border-radius:var(--rm); padding:8px; text-align:center; font-size:12px; cursor:pointer; }
.tpl:hover { background:var(--accC); color:var(--onAccC); }
.mini { position:relative; aspect-ratio:16/9; background:var(--panel); border-radius:calc(var(--rs) * .6); margin-bottom:6px; overflow:hidden; }
.mini i { position:absolute; background:var(--tone2); border-radius:calc(var(--rs) * .35); }
.mini i.bare { background:none; border-bottom:2px solid var(--ink3); border-radius:0; }
.mini i.chart, .mini i.figure { background:var(--panel); outline:1px solid var(--line); }
.mini i.accent { background:var(--acc); }

/* 中间舞台 */
.main { display:flex; flex-direction:column; min-width:0; min-height:0; padding:10px 14px; gap:10px; }   /* min-height:0：放大后页面在中间这一块里滚动，不把整个界面撑高 */
.bar { display:flex; align-items:center; gap:10px; min-width:0; }
.group { display:flex; align-items:center; gap:2px; background:var(--panel); border-radius:var(--pill); padding:4px; }
.ib { white-space:nowrap; flex:none; height:36px; min-width:36px; padding:0 10px; border-radius:var(--pill); display:inline-flex; align-items:center; justify-content:center; gap:6px; font-size:13px; }
.ib:hover { background:var(--tone2); }
.ib.on { background:var(--accC); color:var(--onAccC); }
.ib[disabled] { opacity:.35; pointer-events:none; }
.ib.primary { background:var(--acc); color:#fff; padding:0 18px; }
.ib.primary:hover { filter:brightness(1.1); }
.title-in { border:0; background:transparent; font-size:16px; font-weight:600; padding:6px 10px; border-radius:var(--rs); min-width:120px; max-width:300px; }
.title-in:hover, .title-in:focus { background:var(--panel); outline:none; }
.spacer { flex:1; }
.status { font-size:12px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.stagebox { flex:1; min-height:0; position:relative; display:flex; }
.stagewrap { flex:1; min-width:0; min-height:0; display:grid; place-items:start; position:relative; overflow:auto; }
/* 缩放按钮浮在画面右下角，不占顶栏（顶栏在 1366 宽的笔记本上已经满了） */
.zoombar { position:absolute; right:6px; bottom:4px; display:flex; align-items:center; gap:2px; padding:3px; border-radius:var(--pill);
  background:color-mix(in srgb, var(--panel) 92%, transparent); box-shadow:0 1px 2px rgba(0,0,0,.08), 0 4px 14px rgba(0,0,0,.08); z-index:20; }
.zoombar .ib { height:28px; min-width:28px; padding:0 6px; justify-content:center; font-size:12px; }
.zoombar #zoomFit { min-width:48px; font-variant-numeric:tabular-nums; }
.stagewrap.zoomed { cursor:default; }
.stage { margin:auto; position:relative; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.06), 0 8px 28px rgba(0,0,0,.07); border-radius:calc(var(--rs) * .6); overflow:hidden; }
#svgHost, #svgHost svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
#overlay { position:absolute; inset:0; }
#backdrop { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; pointer-events:none; mix-blend-mode:multiply; opacity:.55; }
#reserve { position:absolute; inset:0; pointer-events:none; }
#reserve i { position:absolute; background:repeating-linear-gradient(135deg, rgba(120,120,120,.10) 0 6px, transparent 6px 12px); }
#reserve b { position:absolute; border:1px dashed rgba(120,120,120,.55); }
.insets { display:grid; grid-template-columns:repeat(2, 1fr); gap:6px 10px; }
.insets .field { margin:0; display:flex; align-items:center; gap:8px; } .insets .field label { margin:0; flex:none; } .insets input { text-align:center; padding:7px 4px; }
.gridlines { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .2s; }
.gridlines.on { opacity:1; }
.gridlines i { position:absolute; background:color-mix(in srgb, var(--acc) 6%, transparent); outline:1px dashed color-mix(in srgb, var(--acc) 22%, transparent); }
.mod { position:absolute; cursor:grab; touch-action:none; }
.mod:hover { outline:1.5px solid color-mix(in srgb, var(--acc) 45%, transparent); outline-offset:2px; }
.mod.sel { outline:2px solid var(--acc); outline-offset:2px; }
.anc { position:absolute; border:1.5px dashed var(--acc); border-radius:6px; cursor:pointer; background:transparent; transition:background .12s; z-index:5; }
.anc:hover { background:color-mix(in srgb, var(--acc) 12%, transparent); }
.anc.on, .anc.pick { border-style:solid; background:color-mix(in srgb, var(--acc) 14%, transparent); }
.anc b { position:absolute; right:-9px; top:-9px; width:18px; height:18px; border-radius:50%; background:#1F2933; color:#fff; font:700 11px/18px var(--sans, sans-serif); text-align:center; }
.pinrow { display:flex; align-items:center; gap:8px; padding:5px 0; }
.pinrow .n { flex:none; width:20px; height:20px; border-radius:50%; background:#1F2933; color:#fff; font-weight:700; font-size:12px; line-height:20px; text-align:center; }
.pinrow .l { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pinrow button { border:0; background:var(--tone); border-radius:8px; width:26px; height:26px; cursor:pointer; }
.mod .chip { position:absolute; left:0; top:-26px; height:22px; padding:0 8px; border-radius:var(--pill); background:var(--acc); color:#fff;
  font-size:11.5px; display:none; align-items:center; gap:4px; white-space:nowrap; pointer-events:none; }
.mod:hover .chip, .mod.sel .chip { display:inline-flex; }
.mod .hint { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  color:var(--ink2); font-size:13px; pointer-events:none; text-align:center; padding:8px; }
.mod .hint svg { width:28px; height:28px; color:var(--ink3); }
.mod .dot { position:absolute; right:-6px; top:-6px; width:14px; height:14px; border-radius:50%; background:#B42318; border:2px solid #fff; }
.mod .dot.warn { background:#B7791F; }
.h { position:absolute; width:14px; height:14px; background:#fff; border:2px solid var(--acc); border-radius:50%; display:none; z-index:2; }
.mod.sel .h { display:block; }
.h.e { right:-9px; top:calc(50% - 7px); cursor:ew-resize; } .h.w { left:-9px; top:calc(50% - 7px); cursor:ew-resize; }
.h.s { bottom:-9px; left:calc(50% - 7px); cursor:ns-resize; } .h.n { top:-9px; left:calc(50% - 7px); cursor:ns-resize; }
.h.se { right:-9px; bottom:-9px; cursor:nwse-resize; }
.ghost { position:absolute; pointer-events:none; background:color-mix(in srgb, var(--acc) 12%, transparent);
  outline:2px dashed var(--acc); outline-offset:-2px;
  transition:left .26s cubic-bezier(.34,1.56,.64,1), top .26s cubic-bezier(.34,1.56,.64,1), width .26s cubic-bezier(.34,1.56,.64,1), height .26s cubic-bezier(.34,1.56,.64,1), border-radius .2s; }
.ghost.bad { background:rgba(180,35,24,.08); outline-color:#B42318; }
.ghost.fill { background:color-mix(in srgb, var(--acc) 18%, transparent); outline-style:solid; }
.peer { position:absolute; pointer-events:none; outline:2px solid color-mix(in srgb, var(--acc) 55%, transparent); outline-offset:-2px;
  transition:border-radius .2s; }
.gchip.bad { background:#B42318; }
.guide { position:absolute; pointer-events:none; background:var(--acc); opacity:.75; z-index:6; }
.peer.push { outline:2px dashed var(--acc); outline-offset:-2px; background:color-mix(in srgb, var(--acc) 8%, transparent); }
.gchip { position:absolute; pointer-events:none; background:var(--ink); color:#fff; font-size:12px; padding:3px 10px; border-radius:var(--pill); white-space:nowrap; transform:translate(-50%,-130%); }
/* 手感（借 M3E：按下微缩、拖起带一点重量的跟随、系统要求少动效时全关） */
.mod { transition:transform .12s cubic-bezier(.2,0,0,1); }
.mod:active { transform:scale(.985); }
.mod.locked::after { content:""; position:absolute; right:8px; bottom:8px; width:10px; height:10px; border-radius:3px; border:2px solid var(--muted, #9CA3AF); }
.lift { transition:left .08s cubic-bezier(.2,0,0,1), top .08s cubic-bezier(.2,0,0,1), width .2s, height .2s; }
@media (prefers-reduced-motion: reduce) { .mod, .lift { transition:none; } .mod:active { transform:none; } }
.lift { position:fixed; z-index:50; pointer-events:none; border-radius:var(--rm); background:color-mix(in srgb, var(--panel) 82%, transparent); color:var(--ink);
  box-shadow:0 10px 30px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.08); display:flex; align-items:center; justify-content:center; gap:8px;
  font-size:13px; transform:scale(1.02); opacity:.94; border:1.5px solid var(--acc); }
.hidebody { opacity:.12; transition:opacity .15s; }

/* 底部页面条 */
.film { display:flex; gap:10px; align-items:center; overflow-x:auto; padding:6px 2px 4px; min-height:104px; }
.thumb { position:relative; flex:none; width:144px; cursor:pointer; user-select:none; }
.thumb .pic { width:144px; height:81px; border-radius:calc(var(--rs) * .6); background:#fff; overflow:hidden; outline:2px solid transparent; outline-offset:2px; }
.thumb .pic img { width:100%; height:100%; display:block; }
.thumb.on .pic { outline-color:var(--acc); }
.thumb .no { position:absolute; left:6px; bottom:6px; font-size:11px; background:rgba(255,255,255,.9); border-radius:var(--pill); padding:0 6px; color:var(--ink2); }
.thumb .bad { position:absolute; right:6px; top:6px; width:10px; height:10px; border-radius:50%; background:#B42318; }
.thumb .tools { position:absolute; right:4px; bottom:4px; display:none; gap:2px; }
.thumb:hover .tools { display:flex; }
.thumb .tools button { width:24px; height:24px; border-radius:var(--pill); background:rgba(255,255,255,.95); display:grid; place-items:center; }
.thumb .tools svg { width:15px; height:15px; }
.thumb.dragover .pic { outline-color:var(--ink3); outline-style:dashed; }
.addpage { flex:none; width:81px; height:81px; border-radius:var(--rm); background:var(--panel); display:grid; place-items:center; color:var(--acc); }
.addpage:hover { background:var(--accC); }

/* 右侧属性 */
.insp { background:var(--panel); border-radius:var(--rl); margin:10px 10px 10px 0; padding:14px; overflow:auto; }
.ihead { display:flex; align-items:center; gap:8px; background:var(--accC); color:var(--onAccC); border-radius:var(--pill); padding:6px 6px 6px 14px; font-weight:600; }
.ihead .spacer { flex:1; }
.ihead button { width:32px; height:32px; border-radius:var(--pill); display:grid; place-items:center; }
.ihead button:hover { background:rgba(255,255,255,.6); }
.field { margin:10px 2px; }
.field label { display:block; font-size:12px; color:var(--ink2); margin-bottom:4px; }
.field input, .field textarea, .field select { width:100%; border:0; background:var(--tone); border-radius:var(--rs); padding:9px 12px; resize:vertical; }
.field input:focus, .field textarea:focus { outline:2px solid var(--acc); background:var(--panel); }
.field textarea.code { font:12px/1.45 ui-monospace,Menlo,Consolas,monospace; min-height:160px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.c { height:32px; padding:0 12px; border-radius:var(--pill); background:var(--tone); font-size:12.5px; display:inline-flex; align-items:center; gap:4px; }
.c:hover { background:var(--tone2); }
.c.on { background:var(--accC); color:var(--onAccC); font-weight:600; }
.c[disabled] { opacity:.4; pointer-events:none; }
.sz { display:grid; grid-template-columns:auto 1fr auto 1fr; gap:6px 8px; align-items:center; font-size:12.5px; color:var(--ink2); }
.step { display:flex; align-items:center; background:var(--tone); border-radius:var(--pill); }
.step button { width:30px; height:30px; border-radius:var(--pill); }
.step button:hover { background:var(--tone2); }
.step span { flex:1; text-align:center; color:var(--ink); font-weight:600; }
.msg { font-size:12.5px; border-radius:var(--rs); padding:8px 10px; margin:6px 0; line-height:1.5; }
.msg.p { background:#FDECEA; color:#8A1C14; }
.msg.w { background:#FDF3E1; color:#7A4A06; }
.msg.n { background:var(--tone); color:var(--ink2); }
.toggle { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; margin:10px 2px; }
.sw { width:46px; height:28px; border-radius:var(--pill); background:var(--tone2); position:relative; transition:background .2s; flex:none; }
.sw::after { content:""; position:absolute; left:4px; top:4px; width:20px; height:20px; border-radius:var(--pill); background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); transition:left .2s; }
.sw.on { background:var(--acc); } .sw.on::after { left:22px; }
.parked { display:flex; flex-wrap:wrap; gap:6px; }
.parked .c { cursor:grab; touch-action:none; }
.ai-wait { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:6px; font-size:13px; font-weight:600;
  color:var(--onAccC); background:color-mix(in srgb, var(--accC) 78%, transparent); pointer-events:none;
  background-image:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); background-size:220% 100%;
  animation:shimmer 1.6s linear infinite; }
@keyframes shimmer { from { background-position:120% 0 } to { background-position:-120% 0 } }
.thumb .aib { position:absolute; left:6px; top:6px; font-size:10.5px; background:var(--acc); color:#fff; border-radius:var(--pill); padding:0 6px; }
.ib.ai { background:var(--accC); color:var(--onAccC); font-weight:600; }
.ib.ai:hover { filter:brightness(.97); }
.aibox { background:var(--accC); border-radius:var(--rm); padding:10px; margin:8px 0; }
.aibox textarea { width:100%; border:0; border-radius:var(--rs); padding:8px 10px; min-height:64px; resize:vertical; background:var(--panel); }
.aibox .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }
.aibox .row .c { background:var(--panel); }
.aibox .row .c.on { background:var(--acc); color:#fff; }
.aibox .go { margin-left:auto; height:32px; padding:0 14px; border-radius:var(--pill); background:var(--acc); color:#fff; font-size:12.5px; }
.req { display:flex; gap:8px; align-items:flex-start; font-size:12.5px; padding:8px 10px; border-radius:var(--rs); background:var(--tone); margin:6px 0; }
.req b { font-weight:600; } .req .st { margin-left:auto; flex:none; font-size:11.5px; border-radius:var(--pill); padding:1px 8px; background:var(--panel); }
.req .st.pending, .req .st.working { background:var(--acc); color:#fff; }
.req .st.failed { background:#FDECEA; color:#8A1C14; }
.req button.c { flex:none; white-space:nowrap; }   /* 窄栏里「取消」原来折成两行竖排 */
.brandlogo { height:72px; border-radius:var(--rm); background:var(--tone); display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:8px; }
.brandlogo img { max-height:56px; max-width:90%; }
.lawyer { background:var(--tone); border-radius:var(--rm); padding:6px 10px; margin:8px 0; }
.lawyer summary { cursor:pointer; font-weight:600; padding:4px 0; }
.lawyer .field input, .lawyer .field textarea { background:var(--panel); }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:var(--pill);
  font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60; max-width:70vw; }
.toast.on { opacity:1; }
/* 悬停看出处：浮在光标旁，不挡鼠标 */
.provtip { position:fixed; z-index:60; max-width:340px; pointer-events:none; background:var(--panel); color:var(--ink); border-radius:var(--rs);
  box-shadow:0 2px 6px rgba(0,0,0,.10), 0 10px 28px rgba(0,0,0,.14); padding:10px 12px; font-size:12.5px; line-height:1.55; }
.provtip b, .prov b { display:block; font-weight:600; }
.provtip span, .prov span { display:block; color:var(--ink2); }
.provtip q, .prov q { display:block; margin-top:4px; padding-left:8px; border-left:2px solid var(--acc); quotes:"「" "」"; }
.provlist { display:flex; flex-direction:column; gap:8px; max-height:320px; overflow:auto; }
.prov { font-size:12.5px; line-height:1.5; background:var(--tone); border-radius:var(--rs); padding:8px 10px; }
.pop { position:absolute; z-index:40; background:var(--panel); border-radius:var(--rl); padding:14px; box-shadow:0 12px 40px rgba(0,0,0,.18); width:420px; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
kbd { font:11px ui-monospace,monospace; background:var(--tone); border-radius:4px; padding:1px 5px; }
.title-in { flex:0 1 auto; min-width:60px; }
@media (max-width: 1500px) {
  .app { --rw:64px; --sw:236px; --iw:272px; }
  .rbtn { width:52px; } .rbtn .pill { width:46px; }
  .tile { padding:10px 6px 8px; } .tile small { display:none; }
  .ib { padding:0 8px; } .ib.primary { padding:0 12px; }
  .bar .status { display:none; }
  .main { padding:10px 10px; }
}
@media (max-width: 1280px) {
  .app { --rw:60px; --sw:200px; --iw:248px; }
  #gridBtn, #tidyBtn { font-size:0; gap:0; } #gridBtn svg, #tidyBtn svg { font-size:14px; }
}

body.noside .app { grid-template-columns:var(--rw) 0 minmax(0,1fr) var(--iw); }
body.noside .side { display:none; }
.rail { grid-column:1; } .side { grid-column:2; } .main { grid-column:3; } .insp { grid-column:4; }   /* 收起左栏时各栏不串位 */
@media (max-width:1380px) { #gridBtn, #tidyBtn, #aiBtn { font-size:0; gap:0; padding:0 9px; } #gridBtn svg, #tidyBtn svg, #aiBtn svg { font-size:14px; } .bar .status { display:none; } #styleSeg .ib { padding:0 8px; } }
.bar { overflow:hidden; }
.bar .group, .bar .ib { flex:none; }
.title-in { flex:1 1 120px; min-width:80px; }
.ib.ai { background:var(--panel); color:var(--ink); font-weight:600; }
.ib.ai svg.i { color:var(--acc); }
.emptypage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
.emptypage b { font-size:20px; } .emptypage span { color:var(--ink2); font-size:13px; }
.emptypage .scns { display:grid; grid-template-columns:repeat(3, 150px); gap:10px; margin-top:8px; }
.scn { display:flex; flex-direction:column; align-items:center; gap:6px; padding:16px 8px; border-radius:var(--rm); background:var(--tone); font-size:13.5px; }
.scn:hover { background:var(--panel); box-shadow:0 0 0 1.5px var(--line), 0 4px 12px rgba(0,0,0,.06); }
.scn svg.i { color:var(--acc); }
/* ---------- 0.7 协调：画布是主角，四周安静；红色只给主操作与当前选中；说明退成轻提示 ---------- */
.rail { gap:2px; padding:12px 0; }
.logo { width:40px; height:40px; margin-bottom:14px; }
.rbtn { width:56px; font-size:11.5px; gap:3px; padding:5px 0; }
.rbtn .pill { width:42px; height:30px; }
.rbtn.on .pill { background:var(--panel); color:var(--acc); box-shadow:0 1px 2px rgba(0,0,0,.08); }
.side { padding:14px 12px 18px; }
.side h3 { font-size:16px; margin:2px 4px 4px; }
.msg.n { background:none; padding:0 4px; margin:2px 0 10px; font-size:12px; line-height:1.55; color:var(--ink2); }
.aibox .msg.n, .insp .msg.n { padding:0 2px; }
.sec { margin:18px 4px 8px; }
.tile, .tpl, .asset { transition:background .15s, box-shadow .15s, transform .15s; }
.tile:hover, .tpl:hover, .asset:hover { background:var(--panel); color:var(--ink); box-shadow:0 0 0 1.5px var(--line), 0 4px 12px rgba(0,0,0,.06); }
.tile svg.i { color:var(--ink2); }
.tile:hover svg.i { color:var(--acc); }
.c.on, .ib.on { background:var(--panel); color:var(--acc); font-weight:600; box-shadow:inset 0 0 0 1.5px var(--acc); }
.aibox { background:var(--tone); }
.aibox .row .c.on { background:var(--panel); color:var(--acc); box-shadow:inset 0 0 0 1.5px var(--acc); }
.ihead { background:var(--tone); color:var(--ink); }
.ihead svg.i { color:var(--acc); }
.mini { box-shadow:0 0 0 1px var(--line); }
.mini i.chart, .mini i.figure { outline:none; background:color-mix(in srgb, var(--acc) 13%, var(--panel)); }
.mini i.conclusion { background:none; border-left:3px solid var(--ink); border-radius:0; }
.bar { gap:8px; }
.title-in { flex:1 1 180px; max-width:360px; min-width:140px; }
.main { padding:10px 12px; gap:8px; }
.film { min-height:92px; gap:8px; }
.thumb, .thumb .pic { width:128px; } .thumb .pic { height:72px; }
.insp { padding:14px 12px; }
.drop { margin-top:4px; }

/* ===================================================================================
   0.9 · 界面改版：与新诉讼可视化的整体界面同一套视觉语言（作者定的，2026-10-27）
   像一张安静的白纸：几乎没有颜色，靠灰度与留白分层；品牌名用宋体；主按钮是黑的。
   深红只留在课件页面（内容）里，界面上一处都不用。有深色模式：跟随系统，也能手动切换。
   这一段只覆盖视觉，不动结构：上面各条布局规则（含缩放、滚动）原样生效。
   =================================================================================== */
:root {
  --w-bg:#FFFFFF; --w-side:#F7F7F8; --w-hover:#EFEFF1; --w-sel:#E9E9EC; --w-line:#ECECEF; --w-line2:#DCDCE0;
  --w-ink:#1D1D1F; --w-ink2:#48484D; --w-mute:#86868B; --w-faint:#B4B4B9; --w-solid:#1D1D1F; --w-on:#FFFFFF;
  --w-pop:0 12px 40px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.06);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei UI","Noto Sans CJK SC",sans-serif;
  --song:"Source Han Serif SC","Noto Serif CJK SC","Songti SC","STSong","SimSun",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --w-bg:#18181A; --w-side:#1E1E21; --w-hover:#26262A; --w-sel:#2C2C30; --w-line:#2A2A2E; --w-line2:#3A3A3F;
  --w-ink:#EDEDF0; --w-ink2:#C4C4C9; --w-mute:#8E8E94; --w-faint:#5E5E64; --w-solid:#EDEDF0; --w-on:#18181A;
  --w-pop:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
} }
:root[data-theme="dark"] {
  --w-bg:#18181A; --w-side:#1E1E21; --w-hover:#26262A; --w-sel:#2C2C30; --w-line:#2A2A2E; --w-line2:#3A3A3F;
  --w-ink:#EDEDF0; --w-ink2:#C4C4C9; --w-mute:#8E8E94; --w-faint:#5E5E64; --w-solid:#EDEDF0; --w-on:#18181A;
  --w-pop:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
}
/* 旧变量全部接到中性灰上：界面不随课件风格换皮，也不再有红 */
body[data-style] {
  --acc:var(--w-solid); --accC:var(--w-sel); --onAccC:var(--w-ink);
  --bg:var(--w-bg); --panel:var(--w-bg); --tone:var(--w-side); --tone2:var(--w-hover); --line:var(--w-line2);
  --ink:var(--w-ink); --ink2:var(--w-mute); --ink3:var(--w-faint);
  --rs:8px; --rm:10px; --rl:10px; --pill:8px;
}
html, body { background:var(--w-bg); color:var(--w-ink); font:400 13px/1.65 var(--sans); letter-spacing:.01em; -webkit-font-smoothing:antialiased; }
:focus-visible { outline:1.5px solid var(--w-ink); outline-offset:2px; }
svg.i { width:16px; height:16px; stroke-width:1.4; }
/* 画布上的纸永远是白的：选框、吸附线、手柄一律用近黑，深色模式下也看得见 */
.stage { --acc:#1D1D1F; background:#fff; box-shadow:none; outline:1px solid var(--w-line2); border-radius:2px; }

/* 导轨与左栏：一整条浅灰侧栏，细线分开 */
.rail { background:var(--w-side); gap:2px; padding:14px 0 12px; }
.logo { width:auto; height:auto; background:none; border-radius:0; color:var(--w-ink); font-family:var(--sans); font-weight:600;
  font-size:15px; letter-spacing:.04em; margin:2px 0 16px; }
.rbtn { width:56px; color:var(--w-mute); font-size:11.5px; gap:3px; padding:4px 0; }
.rbtn .pill { width:40px; height:30px; border-radius:8px; }
.rbtn:hover { color:var(--w-ink); } .rbtn:hover .pill { background:var(--w-hover); }
.rbtn.on { color:var(--w-ink); font-weight:400; }
.rbtn.on .pill { background:var(--w-sel); color:var(--w-ink); box-shadow:none; }
.side { background:var(--w-side); margin:0; border-radius:0; border-right:1px solid var(--w-line); padding:16px 12px 18px; }
.side h3 { font-size:15px; font-weight:500; margin:2px 4px 6px; letter-spacing:.02em; }
.sec { font-size:12px; color:var(--w-mute); letter-spacing:0; margin:20px 4px 8px; }
.sec::after { background:var(--w-line); }
.tile, .tpl, .asset, .scn { background:transparent; border:1px solid var(--w-line2); border-radius:10px; box-shadow:none; color:var(--w-ink); }
.tile:hover, .tpl:hover, .asset:hover, .scn:hover { background:transparent; color:var(--w-ink); border-color:var(--w-mute); box-shadow:none; }
.tile svg.i, .tile:hover svg.i, .scn svg.i { color:var(--w-ink2); }
.asset .ic { background:var(--w-bg); color:var(--w-ink2); border:1px solid var(--w-line); border-radius:8px; }
.asset span, .tile small { color:var(--w-mute); }
.drop { border:1px dashed var(--w-line2); border-radius:10px; color:var(--w-mute); }
.drop.hot { border-color:var(--w-ink); color:var(--w-ink); background:var(--w-hover); }
.mini { background:var(--w-bg); box-shadow:0 0 0 1px var(--w-line); border-radius:4px; }
.mini i { background:var(--w-sel); }
.mini i.chart, .mini i.figure { background:var(--w-hover); outline:1px solid var(--w-line2); }
.mini i.accent { background:var(--w-ink2); }
.mini i.conclusion { border-left:2px solid var(--w-ink2); }

/* 中间：白底，工具栏不再是浮着的胶囊 */
.main { background:var(--w-bg); padding:10px 14px; gap:8px; }
.group { background:transparent; border-radius:8px; padding:0; gap:2px; }
.ib { height:30px; min-width:30px; border-radius:8px; color:var(--w-ink2); font-size:13px; }
.ib:hover { background:var(--w-hover); color:var(--w-ink); }
.ib.on { background:var(--w-sel); color:var(--w-ink); font-weight:400; box-shadow:none; }
.ib.primary { background:var(--w-solid); color:var(--w-on); padding:0 16px; }
.ib.primary:hover { background:var(--w-solid); color:var(--w-on); filter:none; opacity:.88; }
.ib.ai { background:transparent; color:var(--w-ink); font-weight:400; border:1px solid var(--w-line2); }
.ib.ai:hover { background:transparent; border-color:var(--w-mute); filter:none; }
.ib.ai svg.i { color:var(--w-ink2); }
#styleSeg { background:var(--w-side); border-radius:8px; padding:2px; gap:0; }
#styleSeg .ib { height:26px; padding:0 10px; border-radius:6px; font-size:12px; color:var(--w-mute); }
#styleSeg .ib:hover { background:transparent; color:var(--w-ink); }
#styleSeg .ib.on { background:var(--w-bg); color:var(--w-ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
.title-in { font-size:15px; font-weight:500; letter-spacing:.02em; border-radius:8px; color:var(--w-ink); }
.title-in:hover, .title-in:focus { background:var(--w-hover); }
.status { color:var(--w-mute); }
.zoombar { background:var(--w-bg); border:1px solid var(--w-line); box-shadow:var(--w-pop); border-radius:8px; }
.zoombar .ib { border-radius:6px; }
.film { border-top:1px solid var(--w-line); padding-top:10px; }
.thumb .pic { outline:1px solid var(--w-line2); outline-offset:0; border-radius:3px; }
.thumb.on .pic { outline:1.5px solid var(--w-ink); outline-offset:2px; }
.thumb .no { background:rgba(255,255,255,.92); color:#86868B; border-radius:4px; }
.thumb .bad { background:var(--w-ink); }
.thumb .tools button { border-radius:6px; }
.thumb .aib { background:var(--w-solid); color:var(--w-on); border-radius:4px; }
.addpage { background:transparent; border:1px dashed var(--w-line2); border-radius:8px; color:var(--w-mute); }
.addpage:hover { background:transparent; border-color:var(--w-mute); color:var(--w-ink); }
.emptypage b { font-family:var(--sans); font-weight:600; font-size:19px; letter-spacing:.02em; color:#1D1D1F; }
.emptypage span { color:#86868B; }
.scn { padding:16px 8px; font-size:13px; }

/* 画布上的手柄与提示：近黑，不用红 */
.mod .chip { background:#1D1D1F; color:#fff; border-radius:6px; }
.mod .dot { background:#1D1D1F; border-color:#fff; }
.mod .dot.warn { background:#86868B; }
.ghost.bad { background:rgba(0,0,0,.04); outline-color:#86868B; }
.gchip, .gchip.bad { background:#1D1D1F; color:#fff; border-radius:6px; }
.lift { border:1px solid var(--w-line2); border-radius:10px; box-shadow:var(--w-pop); background:var(--w-bg); }

/* 右栏：白底，细线分开 */
.insp { background:var(--w-bg); margin:0; border-radius:0; border-left:1px solid var(--w-line); padding:16px 14px; }
.ihead { background:transparent; color:var(--w-ink); border-radius:0; padding:2px 0 10px; border-bottom:1px solid var(--w-line); font-weight:500; }
.ihead svg.i { color:var(--w-ink2); }
.ihead button { border-radius:8px; } .ihead button:hover { background:var(--w-hover); }
.field label { color:var(--w-mute); }
.field input, .field textarea, .field select { background:var(--w-bg); border:1px solid var(--w-line2); border-radius:8px; color:var(--w-ink); }
.field input:focus, .field textarea:focus, .field select:focus { outline:none; border-color:var(--w-mute); background:var(--w-bg); }
.c { height:28px; padding:0 12px; border-radius:999px; background:transparent; border:1px solid var(--w-line2); color:var(--w-ink2); font-size:12px; }
.c:hover { background:transparent; border-color:var(--w-mute); color:var(--w-ink); }
.c.on, .aibox .row .c.on { background:var(--w-solid); color:var(--w-on); border-color:var(--w-solid); font-weight:400; box-shadow:none; }
.step { background:transparent; border:1px solid var(--w-line2); border-radius:8px; }
.step button { border-radius:6px; } .step span { font-weight:500; }
.msg { border-radius:8px; }
.msg.p { background:var(--w-hover); color:var(--w-ink); }
.msg.w { background:var(--w-side); color:var(--w-ink2); }
.msg.n { color:var(--w-mute); }
.sw { background:var(--w-line2); } .sw.on { background:var(--w-solid); }
.sw::after { background:#fff; } .sw.on::after { background:var(--w-on); }
.aibox { background:transparent; border:1px dashed var(--w-line2); border-radius:10px; }
.aibox textarea { background:var(--w-bg); border:1px solid var(--w-line2); border-radius:8px; color:var(--w-ink); }
.aibox .row .c { background:transparent; }
.aibox .go { background:var(--w-solid); color:var(--w-on); border-radius:8px; }
.req { background:var(--w-side); border-radius:8px; }
.req .st { background:var(--w-bg); border:1px solid var(--w-line2); }
.req .st.pending, .req .st.working { background:var(--w-solid); color:var(--w-on); border-color:var(--w-solid); }
.req .st.failed { background:var(--w-hover); color:var(--w-ink); }
.ai-wait { color:#1D1D1F; background-color:rgba(255,255,255,.72); }
.brandlogo, .lawyer, .prov, kbd, .pinrow button { background:var(--w-side); }
.toast { background:var(--w-solid); color:var(--w-on); border-radius:8px; }
.provtip, .pop { background:var(--w-bg); color:var(--w-ink); border:1px solid var(--w-line); border-radius:10px; box-shadow:var(--w-pop); }
.provtip q, .prov q { border-left:2px solid var(--w-line2); }
.pinrow .n, .anc b { background:#1D1D1F; color:#fff; }

/* ===================================================================================
   0.9 · 版面（安静的对话式布局）：左边一条侧栏（品牌、入口、页面），中间只有这一页，
   底下一个输入框交给 AI；工具抽屉只在点开时出现，右栏只在选中卡片时出现。
   不常用的（网格、整理、风格切换）收进顶栏的「⋯」。
   =================================================================================== */
.app { --rw:244px; --sw:304px; --iw:0px; }
@media (max-width:1500px) { .app { --rw:228px; --sw:292px; } }
@media (max-width:1280px) { .app { --rw:212px; --sw:280px; } }
body.insp-on .app { --iw:300px; }
@media (max-width:1280px) { body.insp-on .app { --iw:272px; } }
body:not(.insp-on) .insp { display:none; }
.stash { display:none !important; }

/* 侧栏 */
.rail { align-items:stretch; gap:1px; padding:12px 10px 10px; overflow:hidden; border-right:1px solid var(--w-line); }
.logo { text-align:left; padding:6px 10px 18px; margin:0; font-size:16px; white-space:nowrap; }
.rail .rbtn { flex-direction:row; width:100%; height:34px; padding:0 10px; gap:10px; border-radius:8px; font-size:13px;
  color:var(--w-ink); justify-content:flex-start; flex:none; }
.rail .rbtn .pill { width:16px; height:16px; background:none; border-radius:0; color:var(--w-ink2); display:grid; place-items:center; flex:none; }
.rail .rbtn:hover { background:var(--w-hover); }
.rail .rbtn:hover .pill, .rail .rbtn.on .pill { background:none; color:var(--w-ink); }
.rail .rbtn.on { background:var(--w-sel); font-weight:400; }
body.noside .rail .rbtn.on { background:none; }
body.noside .rail .rbtn.on:hover { background:var(--w-hover); }
.rail .newpage { margin-bottom:6px; }
.rail .newpage .pill.plus { width:16px; height:16px; border-radius:50%; background:var(--w-solid); color:var(--w-on); }
.rail .newpage .pill.plus svg.i { width:10px; height:10px; stroke-width:2.2; }
.sbsec { font-size:12px; color:var(--w-mute); padding:18px 10px 6px; flex:none; }
.rail .film { flex:1 1 auto; min-height:0; flex-direction:column; align-items:stretch; overflow-y:auto; overflow-x:hidden;
  padding:2px 2px 8px; gap:10px; border-top:0; }
.rail .thumb { width:100%; display:flex; align-items:flex-start; gap:8px; }
.rail .thumb .no { position:static; background:none; padding:0; width:16px; flex:none; text-align:right; font-size:11px; color:var(--w-mute); margin-top:1px; }
.rail .thumb.on .no { color:var(--w-ink); font-weight:600; }
/* 选中页：整行铺一层浅灰底、缩略图本身不加外框（外框会被滚动区的右边裁掉一截，作者 10-28 指出） */
.rail .thumb { padding:5px 6px 5px 2px; border-radius:8px; transition:background .12s; }
.rail .thumb:hover { background:var(--w-hover); }
.rail .thumb.on { background:var(--w-sel); }
.rail .thumb.on .pic { outline:1px solid var(--w-line2); outline-offset:0; }
.rail .thumb .pic { width:auto; flex:1; height:auto; aspect-ratio:16/9; }
.rail .thumb .aib { left:30px; }
.rail .addpage { display:none; }
.sbfoot { display:flex; align-items:center; gap:4px; border-top:1px solid var(--w-line); padding-top:8px; margin-top:4px; flex:none; }
.sbfoot .rbtn { flex:1 1 auto; width:auto; color:var(--w-ink2); }
.sbfoot .ib { color:var(--w-mute); }

/* 工具抽屉（选图、排法、说明、适配、导出、更多） */
.side { background:var(--w-bg); border-right:1px solid var(--w-line); position:relative; padding:18px 16px 20px; }
.dclose { position:absolute; right:10px; top:12px; width:28px; height:28px; border-radius:8px; display:grid; place-items:center; color:var(--w-mute); z-index:2; }
.dclose:hover { background:var(--w-hover); color:var(--w-ink); }

/* 顶栏：标题、这一页的检查、撤销与「⋯」、导出 */
.main { padding:6px 22px 14px; gap:6px; }
.bar { height:46px; gap:6px; }
.title-in { flex:0 1 auto; max-width:420px; min-width:120px; }
.pchk { flex:none; height:24px; padding:0 10px; border:1px solid var(--w-line2); border-radius:999px; font-size:12px; color:var(--w-ink2); white-space:nowrap; }
.pchk:hover { border-color:var(--w-mute); color:var(--w-ink); }
.pchk.ok { border-color:var(--w-line); color:var(--w-mute); }
.bar .group { gap:0; }
.bar .group .ib { color:var(--w-mute); }
.bar .group .ib:hover { color:var(--w-ink); }
#exportBtn { height:30px; padding:0 16px; margin-left:6px; }

/* 画布：缩放按钮平时淡一些，鼠标过来再显出来 */
.zoombar { box-shadow:none; border:1px solid var(--w-line); opacity:.55; transition:opacity .15s; }
.stagebox:hover .zoombar { opacity:1; }

/* 底部输入框（交给 AI） */
.composer { flex:none; display:flex; flex-direction:column; align-items:center; gap:6px; padding:2px 0 0; }
.composer:empty { display:none; }
.composer .req { width:min(680px, 100%); margin:0; }
.cbox { width:min(680px, 100%); border:1px solid var(--w-line2); border-radius:12px; background:var(--w-bg); padding:6px 8px 8px 14px; }
.cbox:focus-within { border-color:var(--w-mute); }
.ckinds { display:flex; gap:2px; margin:0 0 2px -6px; }
.ck { font-size:12px; color:var(--w-mute); padding:1px 8px; border-radius:6px; }
.ck:hover { color:var(--w-ink); }
.ck.on { background:var(--w-side); color:var(--w-ink); }
.crow { display:flex; align-items:flex-end; gap:8px; }
.crow textarea { flex:1; border:0; outline:0; resize:none; background:transparent; color:var(--w-ink); font:inherit; line-height:1.6;
  padding:3px 0; min-height:28px; max-height:120px; }

const api = async (path, opt = {}) => {

/* ---------- 每页 SVG 的记忆：没变的页不再向本机服务要（原来改一个字，60 页的课件要重新拉 60 张缩略图） ----------
   钥匙 = 第几页 + 页 id + 这一页的版本 + 整套的设置（风格、版面、页脚 Logo、名片版本）。哪一样变了钥匙就变；
   页码随位置变，所以「第几页」也在钥匙里。只记在这次打开的页面里，刷新就清空。
   只在「这里的课件已经存到本机服务」时才去取：改动还在路上就取，取到的是改之前的样子，却记在新钥匙下（实测撞到过）。
   取到之前，缩略图先垫着这一页上一次的样子，不闪白。 */
const SVGC = new Map(), SVGD = new Map(), SVGL = new Map();   /* 钥匙 → Promise；钥匙 → 图；页 id → 最近一次的图 */
const gkey = () => [S.deck.style, JSON.stringify(S.deck.frame || null), S.deck.footer_logo ? 1 : 0, S.seen.brand || 0].join("|");
function slideKey(i) { const s = S.deck.slides[i]; return `${i}|${s.id}|${S.ver[s.id] || 0}|${gkey()}`; }
const synced = () => !S.dirty && !S.saving && JSON.stringify(S.deck) === S.synced;
function slideSvg(i) {
  const s = S.deck.slides[i], k = slideKey(i);
  if (SVGC.has(k)) return SVGC.get(k);
  if (!synced()) return Promise.resolve({ text: "", url: "" });                                  /* 存完再取（存完会再叫一次） */
  const p = fetch(`/api/slide/${i}.svg?s=${encodeURIComponent(s.id)}&v=${S.ver[s.id] || 0}`).then(async (r) => {
    const ct = r.headers.get("content-type") || "";
    if (!r.ok || !ct.includes("svg")) { SVGC.delete(k); return { text: "", url: "" }; }       /* 出错不记，下次再要 */
    const text = await r.text();
    for (const k2 of [...SVGC.keys()]) if (k2 !== k && k2.split("|")[1] === s.id) { SVGC.delete(k2); SVGD.delete(k2); }
    const url = URL.createObjectURL(new Blob([text], { type: "image/svg+xml" }));
    const old = SVGL.get(s.id);
    if (old) setTimeout(() => URL.revokeObjectURL(old), 15000);                                /* 还垫在别处的旧图过一会儿再放 */
    SVGD.set(k, url); SVGL.set(s.id, url);
    return { text, url };
  }).catch(() => { SVGC.delete(k); return { text: "", url: "" }; });
  SVGC.set(k, p);
  return p;
}
function fillThumbs() {
  document.querySelectorAll(".thumb img[data-k]").forEach((img) => {
    const i = +img.closest(".thumb").dataset.i, k = img.dataset.k;
    if (!S.deck.slides[i] || slideKey(i) !== k || img.dataset.loaded === k) return;
    slideSvg(i).then((x) => { if (x.url && img.dataset.k === k) { img.src = x.url; img.dataset.loaded = k; } });
  });
}
const slide = () => S.deck.slides[S.cur];
const mods = () => slide().modules;
const T = (type) => S.R.types[type];
const toast = (msg, ms = 2400) => { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), ms); };
const status = (s) => ($("#status").textContent = s);

/* ---------- 撤销 / 保存 ---------- */
function commit(label) {
  S.past.push(S.snap); if (S.past.length > 120) S.past.shift();
  S.future = []; S.snap = JSON.stringify(S.deck);
  S.ver[slide().id] = (S.ver[slide().id] || 0) + 1;
  renderAll(); save(); if (label) status(label);
}
function undo() { if (!S.past.length) return; S.future.push(S.snap); S.snap = S.past.pop(); restore(); }
function redo() { if (!S.future.length) return; S.past.push(S.snap); S.snap = S.future.pop(); restore(); }
function restore() {
  S.deck = JSON.parse(S.snap); S.cur = Math.min(S.cur, S.deck.slides.length - 1);
  if (S.sel && !mods().some((m) => m.id === S.sel)) S.sel = null;
  for (const s of S.deck.slides) S.ver[s.id] = (S.ver[s.id] || 0) + 1;
  applyStyle(); renderAll(); save();
}
/* 两个窗口（或 AI）同时改：按页合并。只有别处改了的页用别处的，只有这里改了的页用这里的，两边都改了同一页以这里为准并提示。 */
function mergeDeck(base, mine, theirs) {
  const by = (d) => Object.fromEntries((d.slides || []).map((s) => [s.id, JSON.stringify(s)]));
  const B_ = by(base), M = by(mine), T = by(theirs), both = [];
  const out = JSON.parse(JSON.stringify(theirs));
  for (const k of ["title", "style", "frame", "footer_logo"]) {
    if (JSON.stringify(mine[k]) !== JSON.stringify(base[k])) { if (mine[k] === undefined) delete out[k]; else out[k] = mine[k]; }
  }
  const slides = [];
  for (const s of theirs.slides) {
    const id = s.id, mineChanged = M[id] !== B_[id], theirsChanged = T[id] !== B_[id];
    if (!(id in M) && id in B_) { if (theirsChanged) slides.push(s); continue; }      /* 这里删了：别处没动就删 */
    if (mineChanged && id in M) {
      if (theirsChanged && M[id] !== T[id]) both.push(theirs.slides.indexOf(s) + 1);
      slides.push(JSON.parse(M[id]));
    } else slides.push(s);
  }
  mine.slides.forEach((s, i) => {                                                     /* 这里新加的页：插在它原来前一页的后面 */
    if (s.id in B_ || s.id in T) return;
    const prev = i ? mine.slides[i - 1].id : null, at = prev ? slides.findIndex((x) => x.id === prev) : -1;
    slides.splice(at + 1, 0, JSON.parse(JSON.stringify(s)));
  });
  out.slides = slides;
  return [out, both];
}
async function save() {
  S.dirty = true;
  if (S.saving) return;
  S.saving = true;
  let tries = 0;
  while (S.dirty) {
    S.dirty = false; status("保存中…");
    const body = JSON.stringify(S.deck);
    const r = await api("/api/deck?base=" + encodeURIComponent(S.seen.deck ?? ""), { method: "POST", body });
    if (r.conflict && tries++ < 5) {                                                  /* 别处先存了：合并后再存，谁的改动都不丢 */
      const [m, both] = mergeDeck(JSON.parse(S.synced || body), S.deck, r.deck);
      S.deck = m; S.synced = JSON.stringify(r.deck); S.seen.deck = r.mtime; S.dirty = true;
      S.cur = Math.min(S.cur, S.deck.slides.length - 1);
      if (S.sel && !mods().some((x) => x.id === S.sel)) S.sel = null;
      for (const s of S.deck.slides) S.ver[s.id] = (S.ver[s.id] || 0) + 1;
      S.snap = JSON.stringify(S.deck); renderAll(); renderInspector();
      toast(both.length ? `另一个窗口（或 AI）也改了第 ${both.join("、")} 页：这一页以本窗口为准，其余已合并` : "另一个窗口（或 AI）同时改了课件：已合并，两边的改动都在", 5000);
      continue;
    }
    if (!r.ok) { status("未保存"); toast(r.error || "保存冲突：请刷新页面", 5000); break; }
    S.synced = body;
    S.seen.deck = r.mtime;
    status("已自动保存");
  }
  S.saving = false;
  refreshSlide();                 /* 存完才取画面：取到的一定是刚存下的样子 */
  refreshReports();
}

/* ---------- 画面 ---------- */
async function refreshSlide() {
  const i = S.cur, k = slideKey(i);
  const x = await slideSvg(i);
  if (i !== S.cur || slideKey(i) !== k || !x.text) return;
  $("#svgHost").innerHTML = x.text;
  fillThumbs();
  markDragging();
}
let repTimer = null;
S.repKey = {};
function refreshReports() {
  clearTimeout(repTimer);
  repTimer = setTimeout(async () => {
    /* 只重查变了的页（钥匙同上）；变了一半以上就整套查。原来改一个字整套 60 页都要重拼一遍检查 */
    const keys = S.deck.slides.map((s, i) => [s.id, slideKey(i)]);
    const want = keys.filter(([id, k]) => S.repKey[id] !== k);
    if (want.length) {
      const full = want.length * 2 > keys.length;
      const got = full ? await api("/api/report")
        : (await api("/api/report?ids=" + want.map(([id]) => encodeURIComponent(id)).join(","))).by_id;
      if (full ? !Array.isArray(got) : !got) return;
      if (full) got.forEach((r, i) => { const id = keys[i]?.[0]; if (id) { S.reps[id] = r; S.repKey[id] = keys[i][1]; } });
      else for (const [id, k] of want) if (got[id]) { S.reps[id] = got[id]; S.repKey[id] = k; }
    }
    renderOverlay(); renderFilm(); renderInspector(true);
  }, 300);
}

  /* 右下角的缩放按钮不许压住页码：页面右边、下边都没有空当时（又宽又矮的窗口），下边多让出一条 */
  if ((wrap.height - g.H * S.fitScale) / 2 < 40 && (wrap.width - g.W * S.fitScale) / 2 < 140)

  wrapEl.classList.toggle("zoomed", S.zoom > 1);

function tplThumb(ms) {
  const W = 160, H = 90, mx = W * .07, my = H * .1, gx = W * .018, gy = H * .035, COLS = 12, ROWS = 6;
  const cw = (W - 2 * mx - (COLS - 1) * gx) / COLS, ch = (H - 2 * my - (ROWS - 1) * gy) / ROWS;
  const INK = "#1D1D1F", LINE = "#D9D9DE", FILL = "#F2F2F4", MUTE = "#C7C7CC", ACC = styleR()?.accent || "#991B1B";
  const n = (v) => Math.round(v * 100) / 100;
  const r = (x, y, w, h, fill, rx = 1, ex = "") => `<rect x="${n(x)}" y="${n(y)}" width="${n(Math.max(w, 0))}" height="${n(Math.max(h, 0))}" rx="${rx}" fill="${fill}"${ex}/>`;
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">`;
  for (const m of ms) {
    let x = mx + m.x * (cw + gx), y = my + m.y * (ch + gy), w = m.w * cw + (m.w - 1) * gx, h = m.h * ch + (m.h - 1) * gy;
    if (m.bleed) { x = 0; y = 0; w = W; h = H; }
    const t = m.type;
    if (t === "title") {
      if (m.level === "cover") s += r(x, y + h * .35, w * .62, H * .07, INK, 1.2) + r(x, y + h * .35 + H * .11, w * .36, H * .035, MUTE);
      else if (m.level === "section") s += r(x, y + h * .4, w * .42, H * .065, INK, 1.2);
      else s += r(x, y + h * .22, Math.min(w * .46, W * .4), H * .052, INK);
      continue;
    }
    if (t === "conclusion") { s += r(x, y + h * .36, 1.6, H * .05, ACC, 0) + r(x + 4, y + h * .4, w * .5, H * .035, INK, 1, ' opacity=".75"'); continue; }
    if (t === "note") { s += r(x, y + h * .45, w * .3, H * .025, MUTE); continue; }
    if (t === "logo") { s += r(x, y + h * .2, h * .55, h * .55, INK, 1.5); continue; }
    if (t === "contact") { for (let k = 0; k < 3; k++) s += r(x + k * w * .22, y + h * .45, w * .16, H * .022, MUTE); continue; }
    if (t !== "quote") s += r(x, y, w, h, FILL, 2.5);
    const px = x + w * .12, py = y + h * .16, pw = w * .76, ph = h * .68;

    } else if (t === "figure") {

      if (fr.includes("V2")) {
        const cy = py + ph * .5;

        for (let k = 0; k < 5; k++) {
          const cx = px + pw * k / 4;

      } else if (fr.includes("V4")) {

      } else {

        for (const [a, b] of [[0, 2], [1, 2], [0, 3], [1, 3]]) s += `<line x1="${n(P[a][0])}" y1="${n(P[a][1])}" x2="${n(P[b][0])}" y2="${n(P[b][1])}" stroke="${MUTE}" stroke-width=".8"/>`;

      }
    } else if (t === "stat") {
      s += r(px, py + ph * .1, pw * .5, ph * .34, ACC) + r(px, py + ph * .6, pw * .7, ph * .12, MUTE);
    } else if (["bullets", "issue", "step", "evidence", "profile", "text"].includes(t)) {
      const rows = h > H * .2 ? 3 : 2;
      for (let k = 0; k < rows; k++) {
        const yy = py + k * ph / rows + ph * .08;

}

async function placeRecipe(id, asNew) {
  const L = S.chartlib, rc = L && L.recipes.find((x) => x.id === id); if (!rc) return;
  const f = L.forms.find((x) => x.code === rc.form);
  if (!S.lib) S.lib = await api("/api/library");
  const b = (S.lib.builtin || []).find((x) => x.name === f?.example);
  if (!b) return toast("找不到这种画法的示例，请检查 V6 是否完整安装", 4000);
  const patch = { spec: JSON.parse(JSON.stringify(b.spec)), sample: true, recipe: rc.id };
  let m = null;
  if (asNew || !mods().length) {                         /* 新的一页：图 + 一句结论 */
    const r = await api("/api/template", { method: "POST", body: JSON.stringify({ modules: [], name: "chart-conclusion" }) });
    if (!r.ok) return toast(r.error, 4000);
    if (asNew) {
      const ids = new Set(S.deck.slides.map((s_) => s_.id)); let k = S.deck.slides.length + 1; while (ids.has("s" + k)) k++;
      S.deck.slides.splice(S.cur + 1, 0, { id: "s" + k, modules: r.modules }); S.cur++;
    } else slide().modules = r.modules;
    m = mods().find((x) => x.type === "chart");
  } else {                                               /* 这一页：选中的图表卡、空的图表卡、图表库的示例卡，依次优先 */
    const ok = (x) => x.type === "chart" && (isEmpty(x) || x.sample);
    m = mods().find((x) => x.id === S.sel && ok(x)) || mods().find(ok);
    if (!m) {
      const p = G.place(S.R, mods(), "chart", 0, 0);
      if (!p) return toast("这一页放不下了：点「新建一页」放，或先腾出地方", 4000);
      m = { id: newId(), type: "chart", x: p[0], y: p[1], w: p[2], h: p[3] }; mods().push(m);
    }
  }
  delete m.file; delete m.pins; delete m.focus; Object.assign(m, patch);
  S.sel = m.id; closeLib(); commit("图表库：" + rc.name); renderAll(); refreshSlide(); renderInspector();
  const ta = $("#aiPrompt");
  if (ta) { ta.value = `按图表库「${rc.name}」（${rc.question}），用我的材料出图。材料在：`; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  toast("放好了。现在是示例数据：在右边交给 AI 换成您的数据，导出前会提醒。", 5000);
}

function tplGroups(cols, only) {
  const groups = {};

    let g = t.group || "排法";
    if (g === "排法") g = t.mods.some((m) => m.type === "chart") ? "以图表为中心" : "以诉讼图为中心";   /* 版式分两组：统计图、诉讼图 */
    (groups[g] ||= []).push([k, t]);

  return want.filter((g) => groups[g]).map((g) => `<div class="sec">${g}</div><div class="tpls" style="grid-template-columns:repeat(${cols === 4 ? 4 : 2},1fr)">` +

}

function bindDrop() {
  const d = $("#drop"); if (!d) return;
  d.ondragover = (e) => { e.preventDefault(); d.classList.add("hot"); };
  d.ondragleave = () => d.classList.remove("hot");
  const send = async (files) => {
    let side = false;
    for (const f of files) {
      const r = await api("/api/upload?name=" + encodeURIComponent(f.name), { method: "POST", body: await f.arrayBuffer() });
      side = side || !!(r.ok && r.sidecar);
      toast(!r.ok ? r.error : r.sidecar ? `已收下出处记录：${f.name}（鼠标停在对应的图上就能看）` : `已加进「已有的图」：${f.name}`, 4000);
    }
    if (side) {                                   /* 出处记录不改画面，但改了每页的检查结果（出处在里面）：重查一遍 */
      for (const s_ of S.deck.slides) S.ver[s_.id] = (S.ver[s_.id] || 0) + 1;
      refreshSlide(); refreshReports();
    }
    await loadLib();
  };
  d.ondrop = (e) => { e.preventDefault(); d.classList.remove("hot"); send(e.dataTransfer.files); };
  const fi = $("#dropFile"); if (fi) fi.onchange = () => { send(fi.files); fi.value = ""; };   /* 不会拖、用触控板的也能传 */
}

function readInfo(m) { return (S.reps[slide().id]?.modules || {})[m.id] || {}; }
function anchorsOverlay(rep) {
  const m = mods().find((x) => x.id === S.sel);
  if (!m || !S.readMode || S.readFor !== m.id) return "";
  const info = (rep.modules || {})[m.id] || {}, k = S.scale, pins = m.pins || [];
  return (info.anchors || []).map((a) => {
    const n = pins.indexOf(a.key) + 1, pick = (S.readMode === "crop" && S.pick.includes(a.key)) || (S.readMode === "focus" && (m.focus || []).includes(a.key));
    const [x, y, w, h] = a.box;
    return `<div class="anc${n && S.readMode === "pin" ? " on" : ""}${pick ? " pick" : ""}" data-key="${esc(a.key)}" title="${esc(a.label || a.key)}"
      style="left:${(x - 3) * k}px;top:${(y - 3) * k}px;width:${(w + 6) * k}px;height:${(h + 6) * k}px">${n && S.readMode === "pin" ? `<b>${n}</b>` : ""}</div>`;
  }).join("");
}
/* ---------- 出处：图里每个元素出自哪里（只读原模块写好的出处：V2 图旁边的溯源索引、V6 逐件记录；不编） ---------- */
function provSection(m) {
  const info = readInfo(m), pv = info.prov;
  if (!pv || !Object.keys(pv).length) return "";
  const lab = Object.fromEntries((info.anchors || []).map((a) => [a.key, a.label || ""]));
  const rows = Object.entries(pv).slice(0, 60).map(([k, p]) =>
    `<div class="prov"><b>${esc(p.head || lab[k] || k)}</b>${p.src ? `<span>${esc(p.src)}</span>` : ""}${p.refs ? `<span>${esc(p.refs)}</span>` : ""}${p.quote ? `<q>${esc(p.quote)}</q>` : ""}</div>`).join("");
  return `<div class="sec">出处</div><div class="msg n">鼠标停在图里的元素上也能看到。只读原模块写好的出处，不编。</div><div class="provlist">${rows}</div>`;
}
function provAt(e) {
  if (S.drag) return null;
  let el = e.target.closest && e.target.closest("#overlay .mod");
  if (!el && e.target.closest && e.target.closest("#overlay .anc") && S.sel) el = document.querySelector(`#overlay .mod[data-id="${CSS.escape(S.sel)}"]`);
  if (!el) return null;
  const info = (S.reps[slide().id]?.modules || {})[el.dataset.id] || {};
  if (!info.prov || !info.anchors) return null;
  const [X, Y] = stagePoint(e);
  let best = null;
  for (const a of info.anchors) {
    const p = info.prov[a.key];
    if (!p || !a.box) continue;
    const [x, y, w, h] = a.box;
    if (X >= x - 3 && X <= x + w + 3 && Y >= y - 3 && Y <= y + h + 3 && (!best || w * h < best.area)) best = { p, area: w * h };
  }
  return best && best.p;
}
function showProv(e) {
  const t = $("#provTip"), p = provAt(e);
  if (!p) { t.hidden = true; return; }
  t.innerHTML = `<b>${esc(p.head)}</b>${p.src ? `<span>${esc(p.src)}</span>` : ""}${p.refs ? `<span>${esc(p.refs)}</span>` : ""}${p.quote ? `<q>${esc(p.quote)}</q>` : ""}`;
  t.hidden = false;
  const r = t.getBoundingClientRect();
  const x = Math.min(e.clientX + 16, innerWidth - r.width - 8), y = e.clientY + 18 + r.height > innerHeight - 8 ? e.clientY - r.height - 12 : e.clientY + 18;

let pollT = null;
async function poll() {

      if (v.listen !== S.listening) { S.listening = v.listen; renderOverlay(); renderFilm(); renderInspector(true); }

        S.seen.ai = v.ai; const r = await api("/api/ai"); S.ai = r.requests; S.aiKinds = r.kinds;
        renderOverlay(); renderFilm(); renderInspector(true);
      }

        S.seen.brand = v.brand; await loadBrand(); for (const s of S.deck.slides) S.ver[s.id] = (S.ver[s.id] || 0) + 1;

      const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName || "") && document.activeElement.id !== "libQ";
      if (v.deck !== S.seen.deck && !S.dirty && !typing) {
        S.seen.deck = v.deck;
        const st = await api("/api/state");
        if (st.mtime !== undefined) S.seen.deck = st.mtime;
        if (JSON.stringify(st.deck) !== JSON.stringify(S.deck)) {
          S.past.push(S.snap); S.future = []; S.deck = st.deck; S.snap = JSON.stringify(S.deck); S.synced = S.snap;
          S.cur = Math.min(S.cur, S.deck.slides.length - 1);
          if (S.sel && !mods().some((m) => m.id === S.sel)) S.sel = null;
          for (const s of S.deck.slides) S.ver[s.id] = (S.ver[s.id] || 0) + 1;
          applyStyle(); renderAll(); refreshSlide(); refreshReports(); renderInspector();
          toast("课件更新了（AI 或别处改的）。不满意可以撤销。", 4000);
        }
      }
    }
  } catch (e) { /* 服务器暂时没响应：下一轮再试 */ }
  pollT = setTimeout(poll, 1500);
}
function pollNow() { poll(); }

  $("#cuColor").oninput = (e) => ($("#cuHex").value = e.target.value.toUpperCase());
  $("#cuHex").onchange = (e) => { if (/^#[0-9a-f]{6}$/i.test(e.target.value)) $("#cuColor").value = e.target.value; };
  $("#cuMake").onclick = async () => done(await api("/api/custom/color", { method: "POST", body: JSON.stringify({ color: $("#cuHex").value.trim() }) }));
  const use = $("#useCustom"); if (use) use.onclick = () => useStyle(CUSTOM);
  const off = $("#offCustom");
  if (off) off.onclick = async () => {
    const r = await api("/api/brand/style/disable", { method: "POST" });
    if (!r.ok) return toast(r.error, 4000);
    await reloadRules(); const stt = await api("/api/state"); S.past.push(S.snap); S.deck = stt.deck; S.snap = JSON.stringify(S.deck);
    for (const s of S.deck.slides) S.ver[s.id] = (S.ver[s.id] || 0) + 1;
    applyStyle(); renderAll(); refreshSlide(); await loadBrand(); renderSide(); toast("已停用自定义风格，换回奇川风（文件改名留着，没有删）", 4000);
  };
}
/* ---------- 版面：铺满全屏 / 预留位置 ---------- */
const FRAME_DEFAULT = { top: 104, right: 48, bottom: 72, left: 48 };
function frameGeom(fr) { return G.geom(S.R.gridBase || S.R.grid, fr); }
function frameOk(fr) {
  const g = frameGeom(fr), b = S.R.gridBase || S.R.grid;
  if (["top", "right", "bottom", "left"].some((k) => !(Number(fr[k]) >= 0))) return "四边留白要是不小于 0 的数";
  if (g.COL < b.MIN_COL || g.ROW < b.MIN_ROW) return `预留得太多，内容区只剩 ${Math.round(g.BLEED[2])}×${Math.round(g.BLEED[3])}：卡片里的字排不下`;
  return "";
}
function setFrame(fr, label) {
  const bad = fr.mode === "reserve" ? frameOk(fr) : "";
  if (bad) { toast(bad, 5000); renderSide(); return false; }
  S.deck.frame = fr;
  for (const s of S.deck.slides) S.ver[s.id] = (S.ver[s.id] || 0) + 1;
  commit(label); fit(); renderSide(); saveNow().then(refreshSlide);
  return true;
}
function renderFrame(el) {
  const fr = S.deck.frame || { mode: "full" }, on = fr.mode === "reserve";
  const v = Object.assign({}, FRAME_DEFAULT, fr), g = frameGeom(on ? fr : null);
  const num = (k, zh) => `<div class="field"><label>${zh}</label><input type="number" min="0" max="400" step="1" data-inset="${k}" value="${Math.round(v[k])}"></div>`;
  el.innerHTML = `<h3>版面</h3>
    <div class="msg n">选「预留位置」，给您模板的 Logo、页眉页脚让出地方。</div>
    <div class="chips"><button class="c${on ? "" : " on"}" id="frFull">铺满全屏</button><button class="c${on ? " on" : ""}" id="frRes">预留位置</button></div>
    ${on ? `<div class="sec">四边留白（整页 1280×720）</div>
      <div class="insets">${num("top", "上")}${num("right", "右")}${num("bottom", "下")}${num("left", "左")}</div>
      <div class="msg n" style="margin-top:8px">内容区 ${Math.round(g.BLEED[2])}×${Math.round(g.BLEED[3])}，每格 ${Math.round(g.COL)}×${Math.round(g.ROW)}；仍是 12 栏 × 6 行，磁吸、连组、拉大拉小照旧。</div>
      ${fr.source ? `<div class="msg n">由${esc(fr.source)}算出${(fr.notes || []).length ? "：" + fr.notes.map(esc).join("；") : ""}。不对就直接改上面的数字。</div>` : ""}
      ${fr.backdrop ? `<label class="toggle"><span>把截图垫在页面下面看效果</span><button class="sw${fr.show_backdrop !== false ? " on" : ""}" id="frShow" aria-label="垫截图"></button></label>` : ""}` : ""}
    <div class="sec">自动算留白</div>
    <div class="msg n">传模板，或截一张模板的空白页（只有 Logo、页眉页脚）。</div>
    <div class="chips"><label class="c" style="cursor:pointer">${icon("upload", 'style="width:15px;height:15px"')}上传模板或截图<input type="file" id="frFile" accept=".pptx,.png,.jpg,.jpeg" hidden></label></div>`;
  $("#frFull").onclick = () => { if (on) setFrame(Object.assign({}, fr, { mode: "full" }), "版面：铺满全屏"); };
  $("#frRes").onclick = () => { if (!on) setFrame(Object.assign({}, FRAME_DEFAULT, fr, { mode: "reserve" }), "版面：预留位置"); };
  el.querySelectorAll("[data-inset]").forEach((inp) => inp.onchange = () => {
    const n = Object.assign({}, fr, { [inp.dataset.inset]: Math.max(0, Math.round(Number(inp.value) || 0)), source: fr.source ? fr.source + "，手动改过" : "手动", notes: [] });
    if (fr.source && fr.source.includes("手动改过")) n.source = fr.source;
    setFrame(n, "已改留白");
  });
  const sh = $("#frShow");
  if (sh) sh.onclick = () => { S.deck.frame = Object.assign({}, fr, { show_backdrop: !sh.classList.contains("on") }); commit("截图：" + (sh.classList.contains("on") ? "不垫" : "垫上")); renderSide(); };
  $("#frFile").onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    status("正在算留白…");
    const r = await api("/api/frame/read?name=" + encodeURIComponent(file.name), { method: "POST", body: await file.arrayBuffer() });
    if (!r.ok) { status("没算成"); return toast(r.error, 6000); }
    $("#backdrop").dataset.v = ""; const old = S.deck.frame || {};
    const nf = Object.assign({}, r.frame, { show_backdrop: true });
    if (!r.frame.backdrop && old.backdrop && file.name.toLowerCase().endsWith(".pptx")) nf.backdrop = false;
    if (setFrame(nf, `已按${r.frame.source}预留位置`))
      toast(`上 ${nf.top} · 右 ${nf.right} · 下 ${nf.bottom} · 左 ${nf.left}${(nf.notes || []).length ? "。" + nf.notes.join("；") : ""}`, 6500);
  };
}
async function reloadRules() { const st = await api("/api/state"); S.R = st.rules; syncGrid(); applyStyle(); }
async function saveBrand(b, rerender) {
  const r = await api("/api/brand", { method: "POST", body: JSON.stringify(b) });
  if (!r.ok) return toast(r.error, 4000);
  status("名片已保存"); await loadBrand(); if (rerender) renderSide(); pollNow();
}
async function introPage(kind, lawyer) {
  await saveNow();
  const r = await api("/api/brand/intro", { method: "POST", body: JSON.stringify({ kind, lawyer }) });
  if (!r.ok) return toast(r.error, 4000);
  const ids = new Set(S.deck.slides.map((s) => s.id)); let n = S.deck.slides.length + 1; while (ids.has("s" + n)) n++;
  const at = kind === "closing" ? S.deck.slides.length : S.cur + 1;
  S.deck.slides.splice(at, 0, { id: "s" + n, modules: r.modules }); S.cur = at; S.sel = null;
  commit("已生成：" + r.note); renderInspector(); refreshSlide();
}

(async function boot() {
  const st = await api("/api/state");
  S.deck = st.deck; S.R = st.rules; S.snap = JSON.stringify(S.deck); S.synced = S.snap;
  S.seen = await api("/api/version"); S.brand = await api("/api/brand");
  if (st.mtime !== undefined) S.seen.deck = st.mtime;                                /* 版本以读课件那一刻为准 */
  const q = await api("/api/ai"); S.ai = q.requests; S.aiKinds = q.kinds;
  syncGrid(); applyStyle(); renderSide(); fit(); renderAll(); renderInspector();
  await refreshSlide(); refreshReports(); loadLib(); loadChartlib();
  status("就绪 · 自动保存"); poll();
  window.__ready = true;
})();
