:root{
  --bg:#FAF6F5; --card:#FFFFFF; --line:#E6E3D9; --line2:#EFEDE6; --soft:#F4EEEC;
  --ink:#1F1E1C; --ink2:#5F5D57; --ink3:#93918A;
  --dark:#1F1E1C; --blue:#2F5A8F; --bluebg:rgba(47,90,143,.10);
  --amber:#B85F3E; --amberbg:#F4DFD7; --amberln:#E7B6A4; --conf:#D97757;
  --green:#2F7D46; --greenbg:#E3F2E6; --red:#B42318;
  --serif:"Source Han Serif SC","Noto Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:inherit}
.topbar{height:44px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px;background:#fff;position:sticky;top:0;z-index:30}
.topbar .brand{font-family:var(--serif);font-size:15px;font-weight:600}
.topbar .crumb{color:var(--ink3)}
.topbar .sp{flex:1}
.shell{display:grid;grid-template-columns:minmax(0,1fr) 0;min-height:calc(100vh - 44px)}
.shell.drawer-open{grid-template-columns:minmax(0,1fr) 430px}
.main{padding:22px 26px 40px;min-width:0}
.wrap{max-width:1240px;margin:0 auto}
.drawer{border-left:1px solid var(--line);background:#fff;overflow:hidden;position:sticky;top:44px;height:calc(100vh - 44px)}
.drawer-in{width:430px;height:100%;display:flex;flex-direction:column}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;font-weight:600;font-size:14px}
.dbody{flex:1;overflow:auto;padding:4px 18px 30px}
.x{border:0;background:none;color:var(--ink3);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--soft);color:var(--ink)}


.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{border:0;background:none;color:var(--ink3);font-size:18px;padding:0 4px}
h1.title{font-family:var(--serif);font-weight:600;font-size:26px;margin:0;letter-spacing:.2px}
.meta{color:var(--ink3);font-size:12.5px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.dark{background:var(--dark);color:#fff;border-color:var(--dark);font-weight:600}
.btn.dark:hover{background:#000}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--soft)}
.btn[disabled]{opacity:.45;cursor:default}
.pill{background:#EFEDE6;color:var(--ink2);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
.hsp{flex:1}
.ico{width:14px;height:14px;display:inline-block;vertical-align:-2px}

.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.tlcard{margin-top:14px;padding:12px 16px 10px}
.tltools{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:6px}
.tltools label{color:var(--ink3);font-size:12.5px}
.sel{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff}
.sq-btn{width:28px;height:28px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.sq-btn:hover{background:var(--soft)}
.more-lanes{border:0;background:none;color:var(--ink2);font-size:12.5px}
.tlscroll{max-height:470px;overflow-y:auto;overflow-x:hidden;position:relative}
#tl svg{display:block;user-select:none}
#tl .grab{cursor:grab}
#tl .grabbing{cursor:grabbing}
.mk{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px 0 8px;border-top:1px solid var(--line2);margin-top:4px;color:var(--ink2);font-size:12px}
.legend .lt{width:150px;font-weight:600;color:var(--ink);font-size:13px}
.legend .li{display:inline-flex;align-items:center;gap:5px}
.legend .types{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding-left:166px}
.tchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;background:#fff}
.tchip.off{opacity:.4}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.undated{display:flex;gap:12px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:9px;margin-top:2px}
.undated .lt{width:150px;font-weight:600;font-size:13px;padding-top:3px}
.ud-list{display:flex;flex-wrap:wrap;gap:6px;flex:1;max-height:62px;overflow:auto}
.udchip{border:1px dashed #C9C6BB;border-radius:999px;padding:2px 10px;background:#fff;font-size:12px;display:inline-flex;align-items:center;gap:6px;max-width:300px}
.udchip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.udchip:hover{background:var(--soft)}


.tbar{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:5px 10px;width:330px}
.search input{border:0;outline:0;flex:1;background:none}
.batch{display:flex;align-items:center;gap:8px;background:var(--dark);color:#fff;border-radius:9px;padding:5px 8px 5px 12px;font-size:12.5px}
.batch button{background:#3A3936;border:0;color:#fff;border-radius:6px;padding:3px 8px}
.tablecard{overflow:hidden}
.tscroll{max-height:620px;overflow:auto}
table.ev{width:100%;border-collapse:collapse}
table.ev th{position:sticky;top:0;background:#FBF8F7;text-align:left;font-weight:500;color:var(--ink2);font-size:12.5px;padding:8px 12px;border-bottom:1px solid var(--line);z-index:2}
table.ev td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
table.ev tr:hover td{background:#FCF9F8}
table.ev tr.selrow td{background:#F5F8FB}
td.dt{width:150px;white-space:nowrap}
td.dt .d{font-weight:500}
td.dt .n{color:var(--ink3);font-size:11.5px}
td.ev .t{font-weight:600;display:flex;align-items:center;gap:6px}
td.ev .s{color:var(--ink2);margin-top:2px}
td.src{width:190px}
td.st{width:96px}
.cb{width:15px;height:15px;accent-color:#1F1E1C;margin:2px 8px 0 0;vertical-align:top}
.tag{display:inline-block;border-radius:5px;padding:0 6px;font-size:11.5px;line-height:18px;white-space:nowrap}
.tag.amber{background:var(--amberbg);color:#A4502F}
.tag.black{background:#1F1E1C;color:#fff}
.tag.grey{background:#EFEDE6;color:var(--ink2)}
.tag.blue{background:#EBF0F6;color:#406A9D}
.tag.out{border:1px solid var(--line);color:var(--ink2);background:#fff;line-height:16px}
.tag.conf{background:var(--amberbg);color:#A4502F}
.tag.rej{background:#F2F0EA;color:var(--ink3);text-decoration:line-through}
.tags{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.srcs{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.sc{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.sq{width:7px;height:7px;background:#B9B6AC;border-radius:1.5px;display:inline-block}
.dref{color:var(--ink);text-decoration:underline;text-decoration-color:#B9B6AC;text-underline-offset:2px;cursor:pointer;background:none;border:0;padding:0;font-size:12px}
.dref:hover{text-decoration-color:var(--ink)}
.stbtn{border:0;background:none;padding:0}
.st-needs{width:13px;height:13px;border:1.5px solid #A9A69C;border-radius:50%;display:inline-block}

mark{background:#EFD3D3;border-radius:3px;padding:0 1px;box-shadow:0 0 0 2px #EFD3D3}

.dtab{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line2)}

table.docs{width:100%;border-collapse:collapse}

.sub{color:var(--ink3);font-size:11.5px}
.rd{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;background:#fff}

.rd.reading{color:#406A9D;border-color:#D3DEEB;background:#EBF0F6}


.newgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}

.drop{border:1px dashed #CFCBBE;border-radius:10px;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin-top:12px;color:var(--ink3)}

.tabsrc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}

.prog{margin-top:12px}

.pop{position:absolute;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(30,28,20,.12);padding:12px;z-index:50;min-width:240px}

.tip{position:fixed;pointer-events:none;background:#1F1E1C;color:#fff;font-size:12px;border-radius:8px;padding:7px 10px;max-width:300px;z-index:80;display:none;line-height:1.45}

.tabs{display:flex;align-items:center;gap:4px;margin-top:14px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 14px;font-size:13.5px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}

.pane{margin-top:14px;padding:16px 18px}
.tlcard{margin-top:14px}
.tltools{flex-wrap:wrap}
.tg{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink2)}
.seg.small{margin:0}

.legend{flex-direction:column;align-items:flex-start;gap:6px}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.lgt{width:150px;font-weight:600;color:var(--ink);font-size:12.5px}
.udchip.claim{border-style:solid}
.sqo{width:9px;height:9px;border:1.5px solid #6F6D66;display:inline-block;flex:none}
.recs{display:flex;flex-direction:column;gap:3px}
.rc{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:5px;padding:0 4px}

.rc.ad{background:#EBF0F6}
.rc .raw{color:var(--ink2)}
.inf{font-size:10.5px;border:1px dashed #A9A69C;border-radius:4px;padding:0 3px;color:var(--ink2)}
td.rl{font-size:12.5px}
.tag.red{background:#FBE9E7;color:#991B1B}
tr.claimrow td{background:#FCF9F8}
.playbar{display:flex;align-items:center;gap:10px;background:#1F1E1C;color:#fff;border-radius:10px;padding:8px 10px;margin:8px 0}

.playbar .pcap{flex:1;font-size:13px}
.playbar .pcap .sub{color:#CFCCC2}
.ctrls{display:flex;align-items:center;gap:8px;margin:10px 0 6px}
.ctrls .seg{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin:8px 0 4px;font-size:12.5px;color:var(--ink2)}
.phr{background:#FBF8F7;border:1px solid var(--line2);border-radius:8px;padding:7px 9px;margin-top:6px;font-size:12.5px;line-height:1.6}
.srcbox.ad{border-color:#CBD8E7;background:#F8FAFC}
.rmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink2);margin-top:4px}

.mxbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.mxwrap{overflow:auto;max-height:640px;border:1px solid var(--line2);border-radius:10px}

td.na{color:#C9C6BB;text-align:center}
td.diff{background:#FAEEEA}
.cell{cursor:pointer;border-radius:6px;padding:3px 4px;margin:-1px -2px 3px}

.assume{background:#F8EBE7;border:1px solid #ECC6B9;border-radius:10px;padding:9px 12px;color:#8F4428;font-size:12.5px;margin-bottom:12px}
.opts{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px;margin-bottom:12px}
.ol{font-weight:600;font-size:12.5px;margin-bottom:4px}

table.ctable{border-collapse:collapse;width:100%;margin-top:12px;font-size:12.5px}
table.ctable td,table.ctable th{padding:7px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}

table.sens td:first-child{width:auto}
input.mini,select.mini{width:84px;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:12px}

.modal{position:fixed;inset:0;background:rgba(31,30,28,.32);z-index:70;display:flex;align-items:center;justify-content:center}
.mbox{width:min(1080px,94vw);height:min(860px,92vh);background:#fff;border-radius:16px;display:grid;grid-template-columns:220px 1fr;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.mside{background:#FBF8F7;border-right:1px solid var(--line);padding:18px 14px}
.mt{font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:12px}
.ms{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;font-size:13px;color:var(--ink2)}
.ms span{font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:#fff}
.ms.on{background:#1F1E1C;color:#fff}

.mmain{padding:22px 26px;overflow:auto;position:relative}
.mmain h3{font-family:var(--serif);font-size:19px;margin:0 0 6px}
.mclose{position:absolute;right:14px;top:12px}
.audgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.audb{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.audb:hover{background:var(--soft)}
.audb.on{border-color:#1F1E1C;box-shadow:0 0 0 1px #1F1E1C}
.audb[disabled]{opacity:.45;cursor:default}
.kv2{display:grid;grid-template-columns:60px 1fr;gap:6px;margin-top:10px;font-size:13px}
textarea.inp{resize:vertical;margin-top:6px;font:inherit}
.picks{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.pick{display:grid;grid-template-columns:20px 150px 1fr auto auto;gap:6px;align-items:center;padding:5px 6px;border-radius:8px;font-size:12.5px}
.pick:hover{background:var(--soft)}
.pick.dis{opacity:.55}
.pick .pd{color:var(--ink2)}
.fk{border:1px solid var(--line);background:#fff;border-radius:6px;color:#C9C6BB;padding:0 6px}
.fk.on{color:#991B1B;border-color:#E8B4AE}
.ckl{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:8px}
.ck{display:flex;gap:8px;font-size:12.5px;align-items:baseline}
.ck.ok>span:first-child{color:var(--green);font-weight:700}
.ck.no>span:first-child{color:#991B1B;font-weight:700}
.ck .sub{width:44px;flex:none}
.a4wrap{background:#EDEBE4;border-radius:10px;padding:18px;display:flex;justify-content:center}
.a4wrap svg{box-shadow:0 4px 18px rgba(0,0,0,.12)}

.rk.infk{color:var(--ink3)}


:root{
  --bg:#F9F9F7; --card:#FCFCFB; --line:#E5E4DE; --line2:#EEEDE8; --soft:#F2F1ED;
  --ink:#141414; --ink2:#555452; --ink3:#8A8986; --dark:#0F0F0F;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
}
html,body{background:var(--bg);font-size:13.5px;color:var(--ink)}
.topbar{background:var(--card);border-bottom:1px solid var(--line);height:46px}
.topbar .brand{font-weight:500}
.main{padding:26px 34px 48px}
.wrap{max-width:1280px}
h1.title{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:.2px;line-height:1.15}
.h1row{gap:12px}
.back{font-size:20px;color:var(--ink3);padding:0 6px 0 0}
.meta{color:var(--ink3);font-size:13.5px}
.pill.soft{background:#EDECE8;color:#4A4946;border-radius:7px;padding:3px 9px;font-size:12.5px}
.btn{border:1px solid #DEDDD7;background:#fff;border-radius:9px;padding:5px 12px;font-size:13.5px;gap:7px;color:var(--ink)}
.btn:hover{background:#F6F5F2}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:600;border-radius:8px;padding:5px 11px}
.btn.dark:hover{background:#000}
.btn.ghost{border-color:transparent;background:none;color:var(--ink)}
.btn.ghost:hover{background:#EFEEEA}
.btn.icon{padding:5px 9px}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.ico{width:15px;height:15px;vertical-align:-3px}
.tabs{border-bottom:0;margin-top:18px;gap:2px}
.tab{border:0;border-radius:8px;padding:5px 12px;font-size:13.5px;color:var(--ink2);margin:0}
.tab:hover{background:#EFEEEA}
.tab.on{background:#EAE9E4;color:var(--ink);font-weight:600;border-bottom:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.tlcard{margin-top:12px;padding:14px 18px 12px}
.tltools{gap:8px;margin-bottom:10px;align-items:center}
.tltools .lab{color:var(--ink3);font-size:13px;margin-left:4px}
.sel{border:1px solid #DEDDD7;border-radius:8px;padding:4px 8px;background:#fff;font-size:13px}
.sq-btn{width:30px;height:30px;border:1px solid #DEDDD7;border-radius:8px;background:#fff;font-size:16px;color:var(--ink)}
.more-lanes{color:var(--ink);font-size:13px;border:0;background:none}
.stage{display:inline-flex;background:#EFEEEA;border-radius:9px;padding:2px}
.stage button{border:0;background:none;border-radius:7px;padding:3px 10px;font-size:12.5px;color:var(--ink2)}
.stage button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.shown{font-size:12.5px;color:#A4502F;background:#F7E6E0;border-radius:7px;padding:3px 8px}
.tlscroll{max-height:520px}
.legend{display:flex;flex-direction:row;align-items:flex-start;gap:0;border-top:1px solid var(--line2);padding:12px 0 10px;margin-top:2px;font-size:13px;color:#3F3E3B}
.legend .lt{width:${'164px'};flex:none;font-weight:600;color:var(--ink);font-size:13.5px}
.legend .lt{width:164px}
.lgi{display:flex;flex-wrap:wrap;gap:7px 16px;align-items:center;flex:1}
.legend .li{gap:6px}
.li.muted{color:var(--ink3)}
.legend .types{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding:8px 0 0 164px}
.undated{border-top:1px dashed #D9D7D0;padding-top:12px}
.undated .lt{width:164px;font-size:13.5px}
.udchip{border:1px dashed #C9C7C0;background:#fff;font-size:12.5px;padding:3px 12px;color:#2A2927}
.ud-list{max-height:66px}
.tbar{margin:22px 0 10px}
.search{border:1px solid #DEDDD7;border-radius:10px;padding:6px 11px;width:340px;background:#fff}
.tablecard{border-radius:14px}
table.ev th{background:var(--card);color:var(--ink2);font-weight:500;font-size:13px;padding:10px 14px;border-bottom:1px solid var(--line);border-right:1px solid var(--line2)}
table.ev td{padding:12px 14px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);background:var(--card)}
table.ev th:last-child,table.ev td:last-child{border-right:0}
table.ev tr:hover td{background:#F8F7F4}
table.ev tr.selrow td{background:#F3F6FA}
td.dt{width:170px}
.dwrap{display:flex;gap:10px;align-items:flex-start}
.cb{margin:3px 0 0}
.cbsp{width:15px;flex:none}
td.dt .d{font-weight:600;font-size:13.5px;color:var(--ink)}
td.dt .n{color:var(--ink3);font-size:12.5px}
td.ev .t{font-size:14px;font-weight:600;gap:7px}
td.ev .s{color:var(--ink2);font-size:13.5px;line-height:1.6;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

function resolvedList(){

  Object.keys(S.arithRes).forEach(id=>out.push({k:'arith',t:id.split(':')[1],label:'已知悉',undo:`delete S.arithRes['${id}'];render()`}));

  return `<div class="h10">
    ${CASE&&CASE.id!=='blank'?`<button class="ibt" title="回到当前案件" onclick="go('work')">${ICO.back}</button>`:''}
    <input class="title nwtitle" id="nwname" placeholder="未命名案件" value="${esc(NEW.name)}" oninput="NEW.name=this.value">
    <span class="hsp"></span>
    <label class="btn ghost">${ICO.book}打开底稿<input type="file" accept=".json,application/json" style="display:none" onchange="openFile(this.files[0])"></label>
    ${CASES.length?`<button class="btn ghost" onclick="S.showSamples=!S.showSamples;render()">${ICO.grid}${CASES.length>1?'示例案件':'已打开的案件'}</button>`:''}
  </div>
  <div class="tabs10 dim">${[['时间线',ICO.lanes],['对照矩阵',ICO.grid],['事实经过',ICO.book]].map(([n,i],k)=>`<button class="${k?'':'on'}" disabled>${i}<span>${n}</span></button>`).join('')}</div>
  ${S.showSamples?`<div class="casegrid">${CASES.map((c,i)=>`<button class="card casecard ${CASE&&CASE.id===c.id?'on':''}" onclick="switchCase(${i})"><div class="cct">${esc(c.title)}</div><div class="sub">${esc(c.cause||'')}</div><div class="ccm num">${(c.materials||[]).length} 份材料 · ${(c.facts||[]).length} 个事实</div></button>`).join('')}</div>`:''}
  <div class="card tlcard nwblank" id="nwdrop" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');addFiles(event.dataTransfer.files)">
    <div class="nwzone">${ICO.doc}<div class="t1">把材料拖到这里</div><div class="t2">起诉状、答辩状、合同、转账记录、聊天记录、证人证言等</div>
      <div class="nwbtns"><label class="btn dark">选择文件<input type="file" multiple style="display:none" onchange="addFiles(this.files);this.value=''"></label><button class="btn" onclick="pasteBox()">粘贴文字</button></div></div>
  </div>
  <div class="card tablecard nwtable"><table class="ev"><thead><tr><th style="width:150px">日期</th><th>事实</th><th style="width:180px">来源</th><th style="width:80px">状态</th></tr></thead><tbody><tr><td colspan="4" class="nwnone">暂无事实</td></tr></tbody></table></div>`;
}
function fmtSize(n){ return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'; }
function addFiles(list){
  const fs=[...(list||[])]; if(!fs.length) return;
  if(fs.length===1 && /\.json$/i.test(fs[0].name) && !NEW.files.length){ openFile(fs[0]); return; }
  fs.forEach(f=>{ NEW.seq++; const o={id:'L-'+String(NEW.seq).padStart(2,'0'),name:f.name,size:f.size,ext:EXTN(f.name),kind:'',date:'',read:true}; NEW.files.push(o); readInto(f,o); });
  if(!NEW.name){ const n=$('#nwname'); if(n&&n.value) NEW.name=n.value; }
  S.view='stage'; render();
}
function pasteBox(){
  const m=document.createElement('div'); m.className='modal'; m.id='pastem';
  m.innerHTML=`<div class="mbox2"><h3>粘贴文字</h3><div class="sub">一段聊天记录、一份笔录或情况说明。</div>
    <input class="inp" id="pname" placeholder="材料名称，例：微信聊天记录（张三与李四）" style="margin-top:12px">
    <textarea class="inp" id="ptext" rows="10" placeholder="把文字粘贴到这里"></textarea>
    <div class="nwrow"><span class="hsp"></span><button class="btn" onclick="document.getElementById('pastem').remove()">取消</button><button class="btn dark" onclick="addPaste()">添加</button></div></div>`;
  m.onclick=e=>{ if(e.target===m) m.remove(); }; document.body.appendChild(m); setTimeout(()=>$('#pname').focus(),20);
}
function addPaste(){ const n=$('#pname').value.trim()||'粘贴的文字', t=$('#ptext').value; if(!t.trim()){ toast('还没有粘贴文字'); return; }
  NEW.seq++; NEW.files.push({id:'L-'+String(NEW.seq).padStart(2,'0'),name:n,size:new Blob([t]).size,ext:'文本',kind:'',date:'',dsrc:'',read:true,text:t});
  $('#pastem').remove(); S.view='stage'; render(); }
function copyText(t){ try{ navigator.clipboard.writeText(t).then(()=>toast('已复制'),()=>toast('复制未成功，请手动选取')); }catch(e){ toast('复制未成功，请手动选取'); } }
function viewStage(){
  const fs=NEW.files, n=fs.filter(f=>f.read).length;
  return `<div class="nw">
  <div class="nwhead"><button class="ibt" title="返回" onclick="go('new')">${ICO.back}</button><h1 class="title">${esc(NEW.name||'未命名案件')}</h1><span class="meta"><span class="num">${fs.length}</span> 份材料</span>
    <span class="hsp"></span><label class="btn ghost">${ICO.add}继续添加<input type="file" multiple style="display:none" onchange="addFiles(this.files);this.value=''"></label>
    <button class="btn dark" ${n?'':'disabled'} onclick="saveNewBase()">保存底稿：<span class="num">${n}</span> 份待读材料</button></div>
  <div class="card" style="margin-top:14px"><div class="tscroll"><table class="docs stg"><thead><tr><th style="width:36px">读</th><th style="width:64px">编号</th><th>材料</th><th style="width:150px">证据种类</th><th style="width:170px">文书日期</th><th style="width:130px">读取</th><th style="width:40px"></th></tr></thead><tbody>
  ${fs.map((f,i)=>`<tr class="${f.read?'':'off'}"><td><input type="checkbox" ${f.read?'checked':''} onchange="NEW.files[${i}].read=this.checked;render()" title="是否读取这份材料"></td>
    <td><b class="num">${f.id}</b></td>
    <td><div class="fn"><span class="fx">${esc(f.ext)}</span><span>${esc(f.name)}</span></div><div class="sub num">${fmtSize(f.size)}</div></td>
    <td><select class="sel" onchange="NEW.files[${i}].kind=this.value"><option value="" ${f.kind?'':'selected'}>读后自动判定</option>${Object.entries(KIND).map(([k,v])=>`<option value="${k}" ${f.kind===k?'selected':''}>${v.n}</option>`).join('')}</select></td>
    <td><input class="inp dt num" type="date" value="${f.date}" onchange="NEW.files[${i}].date=this.value;render()"><div class="sub">${f.date?'手动填写':'留空则读后取落款日'}</div></td>
    <td><span class="rd">尚未读取</span></td>
    <td><button class="ibt" title="移除" onclick="NEW.files.splice(${i},1);if(!NEW.files.length)S.view='new';render()">${ICO.x}</button></td></tr>`).join('')}
  </tbody></table></div></div></div>`;
}
function readInto(f,o){ const rd=new FileReader(), txt=/^text\/|\.txt$|\.md$|\.csv$/i.test(f.type+' '+f.name);
  rd.onload=()=>{ if(txt) o.text=rd.result; else o.data=rd.result; }; txt?rd.readAsText(f,'utf-8'):rd.readAsDataURL(f); }
const pendOut=list=>list.filter(f=>f.read!==false).map(f=>({mid:f.id,name:f.name,size:f.size,kind:f.kind?KIND[f.kind].n:'',doc_date:f.date||'',status:'尚未读取',text:f.text||undefined,data:f.data||undefined}));
function saveNewBase(){
  const t=(NEW.name||'').trim()||'未命名案件';
  const base={schema:'v8-base/1',id:'case-'+Date.now().toString(36),title:t,cause:'',pack:'general',parties:[],materials:[],facts:[],claims:[],relations:[],threads:[],pending:pendOut(NEW.files)};
  saveFile(`${t}.base.json`,JSON.stringify(base,null,2),'application/json');
}
function addToCase(list){
  const fs=[...(list||[])]; if(!fs.length) return; if(!S.pend) S.pend=[];
  const nums=[...DOCS.map(d=>d.id),...S.pend.map(d=>d.id)].map(x=>+(/(\d+)$/.exec(x)||[0,0])[1]), pre=(/^([A-Z]+-)/.exec((DOCS[0]||{}).id||'L-')||[0,'L-'])[1];
  let n=Math.max(0,...nums);
  fs.forEach(f=>{ n++; const o={id:pre+String(n).padStart(2,'0'),name:f.name,size:f.size,ext:EXTN(f.name),kind:'',date:'',read:true}; S.pend.push(o); readInto(f,o); });
  render(); toast(`已加入 ${fs.length} 份材料，尚未读取`);
}
if(CASES.length) loadCase(CASES[0]); else { loadCase({id:'blank',title:'',materials:[],facts:[]}); S.view='new'; }
render();

</script></body></html>
