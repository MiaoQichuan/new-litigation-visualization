  --amber:#B85F3E; --amberbg:#F4DFD7; --amberln:#E7B6A4; --conf:#D97757;
  --green:#2F7D46; --greenbg:#E3F2E6; --red:#B42318;
  --serif:"Source Han Serif SC","Noto Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:inherit}
.topbar{height:44px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px;background:#fff;position:sticky;top:0;z-index:30}
.topbar .brand{font-family:var(--serif);font-size:15px;font-weight:600}
.topbar .crumb{color:var(--ink3)}
.topbar .sp{flex:1}
.shell{display:grid;grid-template-columns:minmax(0,1fr) 0;min-height:calc(100vh - 44px)}
.shell.drawer-open{grid-template-columns:minmax(0,1fr) 430px}
.main{padding:22px 26px 40px;min-width:0}
.wrap{max-width:1240px;margin:0 auto}
.drawer{border-left:1px solid var(--line);background:#fff;overflow:hidden;position:sticky;top:44px;height:calc(100vh - 44px)}
.drawer-in{width:430px;height:100%;display:flex;flex-direction:column}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;font-weight:600;font-size:14px}
.dbody{flex:1;overflow:auto;padding:4px 18px 30px}
.x{border:0;background:none;color:var(--ink3);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--soft);color:var(--ink)}


.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{border:0;background:none;color:var(--ink3);font-size:18px;padding:0 4px}
h1.title{font-family:var(--serif);font-weight:600;font-size:26px;margin:0;letter-spacing:.2px}
.meta{color:var(--ink3);font-size:12.5px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.dark{background:var(--dark);color:#fff;border-color:var(--dark);font-weight:600}
.btn.dark:hover{background:#000}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--soft)}
.btn[disabled]{opacity:.45;cursor:default}
.pill{background:#EFEDE6;color:var(--ink2);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
.hsp{flex:1}
.ico{width:14px;height:14px;display:inline-block;vertical-align:-2px}

.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.tlcard{margin-top:14px;padding:12px 16px 10px}
.tltools{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:6px}
.tltools label{color:var(--ink3);font-size:12.5px}
.sel{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff}
.sq-btn{width:28px;height:28px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.sq-btn:hover{background:var(--soft)}
.more-lanes{border:0;background:none;color:var(--ink2);font-size:12.5px}
.tlscroll{max-height:470px;overflow-y:auto;overflow-x:hidden;position:relative}
#tl svg{display:block;user-select:none}
#tl .grab{cursor:grab}
#tl .grabbing{cursor:grabbing}
.mk{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px 0 8px;border-top:1px solid var(--line2);margin-top:4px;color:var(--ink2);font-size:12px}
.legend .lt{width:150px;font-weight:600;color:var(--ink);font-size:13px}
.legend .li{display:inline-flex;align-items:center;gap:5px}
.legend .types{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding-left:166px}
.tchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;background:#fff}
.tchip.off{opacity:.4}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.undated{display:flex;gap:12px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:9px;margin-top:2px}
.undated .lt{width:150px;font-weight:600;font-size:13px;padding-top:3px}
.ud-list{display:flex;flex-wrap:wrap;gap:6px;flex:1;max-height:62px;overflow:auto}
.udchip{border:1px dashed #C9C6BB;border-radius:999px;padding:2px 10px;background:#fff;font-size:12px;display:inline-flex;align-items:center;gap:6px;max-width:300px}
.udchip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.udchip:hover{background:var(--soft)}


.tbar{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:5px 10px;width:330px}
.search input{border:0;outline:0;flex:1;background:none}
.batch{display:flex;align-items:center;gap:8px;background:var(--dark);color:#fff;border-radius:9px;padding:5px 8px 5px 12px;font-size:12.5px}
.batch button{background:#3A3936;border:0;color:#fff;border-radius:6px;padding:3px 8px}
.tablecard{overflow:hidden}
.tscroll{max-height:620px;overflow:auto}
table.ev{width:100%;border-collapse:collapse}
table.ev th{position:sticky;top:0;background:#FBF8F7;text-align:left;font-weight:500;color:var(--ink2);font-size:12.5px;padding:8px 12px;border-bottom:1px solid var(--line);z-index:2}
table.ev td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
table.ev tr:hover td{background:#FCF9F8}
table.ev tr.selrow td{background:#F5F8FB}
td.dt{width:150px;white-space:nowrap}
td.dt .d{font-weight:500}
td.dt .n{color:var(--ink3);font-size:11.5px}
td.ev .t{font-weight:600;display:flex;align-items:center;gap:6px}
td.ev .s{color:var(--ink2);margin-top:2px}
td.src{width:190px}
td.st{width:96px}
.cb{width:15px;height:15px;accent-color:#1F1E1C;margin:2px 8px 0 0;vertical-align:top}
.tag{display:inline-block;border-radius:5px;padding:0 6px;font-size:11.5px;line-height:18px;white-space:nowrap}
.tag.amber{background:var(--amberbg);color:#A4502F}
.tag.black{background:#1F1E1C;color:#fff}
.tag.grey{background:#EFEDE6;color:var(--ink2)}
.tag.blue{background:#EBF0F6;color:#406A9D}
.tag.out{border:1px solid var(--line);color:var(--ink2);background:#fff;line-height:16px}
.tag.conf{background:var(--amberbg);color:#A4502F}
.tag.rej{background:#F2F0EA;color:var(--ink3);text-decoration:line-through}
.tags{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.srcs{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.sc{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.sq{width:7px;height:7px;background:#B9B6AC;border-radius:1.5px;display:inline-block}
.dref{color:var(--ink);text-decoration:underline;text-decoration-color:#B9B6AC;text-underline-offset:2px;cursor:pointer;background:none;border:0;padding:0;font-size:12px}
.dref:hover{text-decoration-color:var(--ink)}
.stbtn{border:0;background:none;padding:0}
.st-needs{width:13px;height:13px;border:1.5px solid #A9A69C;border-radius:50%;display:inline-block}
.st-ok{background:var(--greenbg);color:var(--green);border-radius:999px;padding:1px 9px 1px 7px;font-size:12px;display:inline-flex;align-items:center;gap:5px;font-weight:500}
.st-ok:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.st-dis{background:#F2F0EA;color:var(--ink2);border-radius:999px;padding:1px 9px;font-size:12px}
.foot{color:var(--ink3);font-size:12px;margin-top:16px}


.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 9px;font-size:12.5px}
.chip.on{background:#EEF3F8;border-color:#CBD8E7;color:#406A9D}
.chip .c{color:var(--ink3);margin-left:3px}
.rcard{border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;margin-bottom:12px;background:#FDFCFA}
.rk{font-size:11.5px;color:#A4502F;font-weight:600;margin-bottom:6px}
.rk.dup,.rk.np,.rk.inf,.rk.att{color:var(--ink3)}
.rt{font-weight:600;font-size:14px;margin-bottom:8px}
.cand{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;margin-bottom:8px}
.cand .d{font-weight:700;font-size:14.5px}
.cand .e{margin:2px 0 6px}
.q{background:#F2F0EA;border-radius:8px;padding:8px 10px;margin:6px 0;font-family:var(--serif);font-size:13px;line-height:1.65;color:#3A3935}
.q .loc{display:block;font-family:var(--sans);font-size:11px;color:var(--ink3);margin-top:3px}
.ra{display:flex;justify-content:flex-end;gap:14px;align-items:center;margin-top:6px}
.lnk{border:0;background:none;color:var(--ink2);font-size:12.5px;padding:2px 0}
.lnk:hover{color:var(--ink);text-decoration:underline}
.ctx{border-left:3px solid #D8D4C6;padding:2px 0 2px 10px;margin:8px 0;color:var(--ink2);font-size:12.5px}
.calc{background:#F1F5F9;border-radius:8px;padding:7px 10px;color:#375B87;font-size:12.5px;margin:6px 0}
.warn{background:var(--amberbg);border-radius:8px;padding:7px 10px;color:#A4502F;font-size:12.5px;margin:8px 0}
.dupr{display:grid;grid-template-columns:20px 112px 1fr;gap:4px 6px;padding:6px 0;border-bottom:1px solid var(--line2);align-items:start}
.dupr:last-of-type{border-bottom:0}
.npr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 0;border-bottom:1px solid var(--line2)}
.npr .d{font-weight:600}
.resolved{border:1px solid var(--line2);border-radius:10px;padding:8px 10px;margin-bottom:8px;color:var(--ink2);font-size:12.5px;display:flex;justify-content:space-between;gap:8px;background:#fff}
.resolved b{color:var(--ink)}
.resolved .lnk{white-space:nowrap}
details.rel summary{cursor:pointer;color:var(--ink2);font-size:12.5px;padding:4px 0}
.relrow{display:flex;gap:6px;align-items:center;padding:5px 0;font-size:12.5px;border-bottom:1px solid var(--line2)}


.ed-type{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:12.5px}
.ed-title{font-family:var(--serif);font-size:19px;font-weight:600;margin:6px 0 2px;line-height:1.35}
.ed-date{font-size:14px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:10px 0}
.seg button{border:0;background:#fff;padding:4px 10px;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--dark);color:#fff}
.star{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:12.5px;margin-left:8px}
.star.on{background:#F7ECEC;border-color:#E2BDBD}
.sec{margin-top:16px;font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:.3px}
.srcbox{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.srchead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.srchead .nm{color:var(--ink2);font-size:12.5px}


.doc-l{padding:6px 2px;border-bottom:1px solid var(--line2);font-family:var(--serif);font-size:13.5px;line-height:1.75}
.doc-l.h{font-weight:700;font-size:15px;border-bottom:0}
mark{background:#EFD3D3;border-radius:3px;padding:0 1px;box-shadow:0 0 0 2px #EFD3D3}
.doc-l.hit{background:#FBF2EE}


.dtab{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.dtab .on{font-weight:600}
.dtab .off{color:var(--ink3)}
table.docs{width:100%;border-collapse:collapse}
table.docs th{text-align:left;color:var(--ink2);font-weight:500;font-size:12.5px;padding:8px 12px;border-bottom:1px solid var(--line)}
table.docs td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.sub{color:var(--ink3);font-size:11.5px}
.rd{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;background:#fff}
.rd.q{color:#406A9D;border-color:#D3DEEB;background:#F3F6FA}
.rd.reading{color:#406A9D;border-color:#D3DEEB;background:#EBF0F6}


.newgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.ncard{padding:16px}
.ncard h3{margin:0 0 3px;font-size:14px}
.drop{border:1px dashed #CFCBBE;border-radius:10px;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin-top:12px;color:var(--ink3)}
.inp{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;width:100%}
.tabsrc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tabsrc button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 9px;font-size:12.5px}
.tabsrc button.on{background:#EBF0F6;border-color:#D3DEEB;color:#406A9D}


.prog{margin-top:12px}
.bar{height:3px;background:#ECE9E0;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:#C2552E;transition:width .4s}
.progtxt{display:flex;justify-content:space-between;color:var(--ink2);font-size:12.5px;margin-top:6px}


.pop{position:absolute;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(30,28,20,.12);padding:12px;z-index:50;min-width:240px}
.pop h4{margin:2px 0 8px;font-size:12px;color:var(--ink3);font-weight:600}
.opt{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--soft)}
.sw{width:30px;height:20px;border-radius:5px;border:1px solid var(--line);display:flex;overflow:hidden}
.sw i{flex:1}
.menuitem{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:7px}
.menuitem:hover{background:var(--soft)}
.fgroup{margin-bottom:10px}
.fgroup label{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:12.5px}

.tip{position:fixed;pointer-events:none;background:#1F1E1C;color:#fff;font-size:12px;border-radius:8px;padding:7px 10px;max-width:300px;z-index:80;display:none;line-height:1.45}
.tip .tt{font-weight:600}
.tip .td{color:#CFCCC2}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(30,28,20,.14);padding:9px 14px;font-size:13px;display:none;z-index:90;align-items:center;gap:8px}
.toast .ok{width:16px;height:16px;border-radius:50%;background:var(--greenbg);color:var(--green);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.empty{color:var(--ink3);padding:24px 0;text-align:center}


.tabs{display:flex;align-items:center;gap:4px;margin-top:14px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 14px;font-size:13.5px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.tabs .sub{padding-right:4px}
.pane{margin-top:14px;padding:16px 18px}
.tlcard{margin-top:14px}
.tltools{flex-wrap:wrap}
.tg{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink2)}
.seg.small{margin:0}
.seg.small button{padding:3px 9px;font-size:12px}
.seglab{padding:3px 8px;font-size:12px;color:var(--ink3);border-right:1px solid var(--line);background:#FBF8F7}
.countbar{font-size:12px;color:var(--ink3);margin:2px 0 6px;padding-left:2px}
.countbar b{color:var(--ink)}
.countbar.warn{color:#A4502F}
.legend{flex-direction:column;align-items:flex-start;gap:6px}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.lgt{width:150px;font-weight:600;color:var(--ink);font-size:12.5px}
.udchip.claim{border-style:solid}
.sqo{width:9px;height:9px;border:1.5px solid #6F6D66;display:inline-block;flex:none}
.recs{display:flex;flex-direction:column;gap:3px}
.rc{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:5px;padding:0 4px}
.rc.cf{background:#F7E6E0}
.rc.ad{background:#EBF0F6}
.rc .raw{color:var(--ink2)}
.inf{font-size:10.5px;border:1px dashed #A9A69C;border-radius:4px;padding:0 3px;color:var(--ink2)}
td.rl{font-size:12.5px}
.tag.red{background:#FBE9E7;color:#991B1B}
tr.claimrow td{background:#FCF9F8}
.playbar{display:flex;align-items:center;gap:10px;background:#1F1E1C;color:#fff;border-radius:10px;padding:8px 10px;margin:8px 0}
.playbar .btn{background:#3A3936;border-color:#3A3936;color:#fff}
.playbar .pcap{flex:1;font-size:13px}
.playbar .pcap .sub{color:#CFCCC2}
.ctrls{display:flex;align-items:center;gap:8px;margin:10px 0 6px}
.ctrls .seg{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin:8px 0 4px;font-size:12.5px;color:var(--ink2)}
.phr{background:#FBF8F7;border:1px solid var(--line2);border-radius:8px;padding:7px 9px;margin-top:6px;font-size:12.5px;line-height:1.6}
.srcbox.ad{border-color:#CBD8E7;background:#F8FAFC}
.rmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink2);margin-top:4px}

.mxbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.mxwrap{overflow:auto;max-height:640px;border:1px solid var(--line2);border-radius:10px}
table.mx{border-collapse:collapse;min-width:100%}
table.mx th{position:sticky;top:0;background:#FBF8F7;font-weight:500;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:12px;z-index:1;min-width:120px}
table.mx th.mxh{left:0;z-index:2;min-width:190px}
table.mx td{border-bottom:1px solid var(--line2);border-left:1px solid var(--line2);padding:6px 8px;vertical-align:top;font-size:12px}
td.mxf{position:sticky;left:0;background:#fff;cursor:pointer;min-width:190px;font-size:12.5px}
td.mxf .t{font-weight:600;display:flex;gap:6px;align-items:center}
td.na{color:#C9C6BB;text-align:center}
td.diff{background:#FAEEEA}
.cell{cursor:pointer;border-radius:6px;padding:3px 4px;margin:-1px -2px 3px}
.cell:hover{background:#F2E9E6}
.cell.ad{outline:1.5px solid #AEC2DA;background:#F6F8FB}
.cell .qq{color:var(--ink2);font-family:var(--serif);font-size:11.5px;margin-top:2px;line-height:1.5}
.grp{display:inline-block;font-size:10.5px;background:#1F1E1C;color:#fff;border-radius:4px;padding:0 4px;margin-right:4px}
td.mxs{white-space:nowrap;color:#A4502F;font-weight:600}

.assume{background:#F8EBE7;border:1px solid #ECC6B9;border-radius:10px;padding:9px 12px;color:#8F4428;font-size:12.5px;margin-bottom:12px}
.opts{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px;margin-bottom:12px}
.ol{font-weight:600;font-size:12.5px;margin-bottom:4px}
.opt2{display:grid;grid-template-columns:18px auto;gap:0 6px;align-items:start;padding:4px 0;font-size:12.5px;cursor:pointer}
.opt2 .sub{grid-column:2}
table.ctable{border-collapse:collapse;width:100%;margin-top:12px;font-size:12.5px}
table.ctable td,table.ctable th{padding:7px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
table.ctable th{font-weight:500;color:var(--ink2);background:#FBF8F7}
table.ctable td:first-child{width:150px;color:var(--ink2)}
table.ctable tr.cur td{background:#F1F5F9}
table.sens td:first-child{width:auto}

.review-state.clear{background:#E9F6EC;color:#21643B}
.review-state.conflict{background:#FCE8E5;color:#9A3429}
.review-state.review{background:#F8E9E4;color:#854A19}
.review-state.checked{background:#ECF0F6;color:#345175}
.review-banner{display:flex;box-sizing:border-box;width:100%;padding:8px 10px;margin:8px 0;border-left:3px solid currentColor;font-size:13px}

.review-tick{font-weight:700;color:#345175}
.fact-status-cell .review-state.checked{white-space:normal}
.linked-checks{margin-top:8px}
.linked-checks>summary{cursor:pointer;color:var(--ink2)}
.linked-checks .dref{white-space:normal;text-align:left}

.review-evidence ul{list-style:none;padding:0;margin:5px 0 10px;display:grid;gap:5px}
.review-evidence li{border-left:2px solid var(--line);padding-left:8px}
.review-evidence .dref{font-size:13px;text-align:left;white-space:normal}
.review-evidence .sub{margin-top:1px}
.review-difference{border-left:3px solid #D97757;background:#FBEFEA;border-radius:5px;padding:8px 10px;margin:8px 0 12px}

.record-title{font-size:12px}
.cand>.btn{margin-top:6px}

.timeline-month{border-top:1px solid var(--line)}

  const e=derive().find(x=>x.id===id); if(e && !e.undated && (e.sortKey<S.t0||e.sortKey>S.t1)){ const sp=S.t1-S.t0; S.t0=e.sortKey-sp/2; S.t1=e.sortKey+sp/2; clampView(); drawTimeline(); }
  if(fromTable) document.getElementById('row-'+id)?.scrollIntoView({block:'nearest'});
}
function openDoc(d,rid){ pushD({kind:'doc',d,rid}); render(); setTimeout(()=>{ const m=document.querySelector('#drawerIn .hit'), b=document.querySelector('#drawerIn .dbody'); if(m&&b&&!b.querySelector('.source-scan')) b.scrollTop=m.offsetTop-b.offsetTop-b.clientHeight/3; },30); }
function renderDrawer(){
  const sh=$('#shell'), inn=$('#drawerIn');
  if(!S.drawer){ sh.classList.remove('drawer-open'); inn.innerHTML=''; return; }
  sh.classList.add('drawer-open'); const d=S.drawer;
  inn.innerHTML = d.kind==='review'?drawerReview(): d.kind==='fact'?drawerFact(d.id): d.kind==='doc'?drawerDoc(d.d,d.rid): d.kind==='claim'?drawerClaim(d.id): drawerLog();
  const st=S.dStack||[]; if(st.length){ const h=inn.querySelector('.dhead'); if(h) h.insertAdjacentHTML('afterbegin',`<button class="dback" onclick="backDrawer()" title="返回上一层（Esc）"><svg class="ic" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>${DLAB[st[st.length-1].kind]||'返回'}</button>`); }
}
function q(s,showDoc=true,loc){
  return `${showDoc?`<div class="srchead">${kindTag(s.d)}<button class="dref" onclick="openDoc('${s.d}','${s.rid||''}')">${s.d}</button><span class="nm">${esc(loc||s.loc)}</span></div>`:''}<div class="q">${esc(s.q)}</div>${(s.qx||[]).map(x=>`<div class="q qx">${esc(x)}</div>`).join('')}`;
}
function drawerReview(){
  const items=reviewItems(), cnt={}; let total=0;
  const clear=clearReviewCandidates(items);
  const alsoAmount=it=>it.k==='conflict'&&it.e.amtConflict;
  items.forEach(it=>{
    const n=itemCount(it);
    cnt[it.k]=(cnt[it.k]||0)+n;
    if(alsoAmount(it)) cnt.amount=(cnt.amount||0)+n;
    total+=n;
  });
  const chips=[['all','全部',total],['conflict','日期冲突',cnt.conflict||0],['amount','金额冲突',cnt.amount||0],['fact','事实待核',cnt.fact||0],['dup','疑似重复',cnt.dup||0],['arith','数字对不上',cnt.arith||0],['pack',PACK.n+'规则',cnt.pack||0],['infer','推断日期',cnt.infer||0],['suspect','可疑日期',cnt.suspect||0],['np','仅有陈述',cnt.np||0],['att','需留意',cnt.att||0]];
  const list=items.filter(it=>S.rfilter==='all'||it.k===S.rfilter||(S.rfilter==='amount'&&alsoAmount(it)));
  const done=resolvedList().filter(x=>S.rfilter==='all'||x.k===S.rfilter);
  const evs=derive(), E=Object.fromEntries(evs.map(e=>[e.id,e]));
  const rel=`<details class="rel"><summary>${RELATED.length} 组材料写明了指向的事实</summary>${RELATED.map(([a,b,t])=>E[a]&&E[b]?`<div class="relrow"><button class="dref" onclick="selectEv('${a}')">${esc(E[a].title)}</button><span>→</span><button class="dref" onclick="selectEv('${b}')">${esc(E[b].title)}</button><span class="sub">${t}</span></div>`:'').join('')}</details>`;
  return `<div class="dhead"><span>待审</span><button class="x" onclick="closeDrawer()">×</button></div>
  <div class="dbody"><div class="review-bulk">
    <button class="btn" onclick="exportBase()">导出复核底稿</button>
    <button class="btn" onclick="confirmClearFacts()" ${clear.length?'':'disabled'}>${clear.length?`一键确认 ${clear.length} 条未见冲突事实`:'没有可一键确认的事实'}</button>
    ${clear.length?`<details class="linked-checks"><summary>查看本次确认范围</summary>
      <ol>${clear.map(e=>`<li><button class="dref" onclick="selectEv('${e.id}')">${esc(dateLabel(e))} · ${esc(e.title)}</button>
      ${e.f.narr?`<div class="sub">${esc(e.f.narr)}</div>`:''}</li>`).join('')}</ol>
    </details>`:''}
  </div><div class="chips">${chips.filter(([k,n,c])=>k==='all'||c>0||S.rfilter===k).map(([k,n,c])=>`<button class="chip ${S.rfilter===k?'on':''}" onclick="S.rfilter='${k}';renderDrawer()">${n}<span class="c">${c}</span></button>`).join('')}</div>
  ${S.phase!=='ready'?'<div class="empty">比对完成后出现待审项</div>':list.map(it=>`<div class="rcard">${card(it)}</div>`).join('')||'<div class="empty">这一类没有待审项</div>'}
  ${done.length?`<div class="sec">已处理 ${done.length}</div>${done.map(x=>`<div class="resolved"><span>${RK[x.k]} · ${esc(x.t)}：<b>${esc(x.label)}</b></span><button class="lnk" onclick="${x.undo}">撤销</button></div>`).join('')}`:''}
  ${S.phase==='ready'?rel:''}</div>`;
}
function resolvedList(){
  const out=[];
  Object.entries(S.dupRes).forEach(([id,v])=>{ const g=dupGroups(true).find(x=>x.id===id); out.push({k:'dup',t:g?g.fids.map(f=>FACT[f].title).join(' / '):id,label:v==='merge'?'已合并为一个事实':'确认是不同的事，分开',undo:`delete S.dupRes['${id}'];logIt(null,'撤销疑似重复处理','');render()`}); });
  Object.keys(S.arithRes).forEach(id=>out.push({k:'arith',t:id.split(':')[1],label:'已知悉',undo:`delete S.arithRes['${id}'];render()`}));
  const manuallyReviewed=new Map();
  for(const e of derive()){
    if(e.rev==='done'&&!e.adopted&&!pendingReviewNote(e.f.id)&&(factIssue(e)||e.stmtOnly||e.est||e.susOnly)){
      manuallyReviewed.set(e.f.id,e);
    }
  }
  manuallyReviewed.forEach((e,fid)=>out.push({k:factIssue(e)||'fact',t:e.title,label:e.anyConf||e.f.reviewConflict?'已确认，保留不同记载':'已确认',undo:`toggleRev('${fid}')`}));
  Object.entries(S.adopt).forEach(([fid,rid])=>out.push({k:'conflict',t:FACT[fid].title,label:`采信 ${REC[rid].d}「${REC[rid].raw}」`,undo:`unAdopt('${fid}')`}));
  Object.entries(S.cres).forEach(([fid,v])=>out.push({k:'conflict',t:FACT[fid].title,label:v==='split'?'不是同一件事，已拆开':'其中一条只是约定，保留全部',undo:`delete S.cres['${fid}'];render()`}));
  Object.entries(S.inferOk).forEach(([k,v])=>out.push({k:'infer',t:INFER[k].n,label:v==='ok'?'确认推断':'改为无日期',undo:`delete S.inferOk['${k}'];render()`}));
  Object.entries(S.susRes).forEach(([rid,v])=>out.push({k:'suspect',t:REC[rid].raw,label:v==='typo'?'按笔误处理，不生成事实':'生成为独立事实',undo:`delete S.susRes['${rid}'];render()`}));
  if(S.aside.size) out.push({k:'np',t:'仅有当事人陈述',label:`暂置 ${S.aside.size} 条`,undo:'S.aside.clear();render()'});
  Object.keys(S.attnRes).forEach(id=>out.push({k:'att',t:ATTN.find(a=>a.id===id).title,label:'已知悉',undo:`delete S.attnRes['${id}'];render()`}));
  Object.keys(S.packRes).forEach(id=>out.push({k:'pack',t:id.split(':')[1],label:'已知悉',undo:`delete S.packRes['${id}'];render()`}));
  return out;
}
function factDifference(e){
  if(e.f.cnote) return e.f.cnote;
  const differences=[];
  if(e.conflict||e.wasConflict){
    const dates=[...new Set(e.strict.map(r=>r.p==='day'?fmtD(r.s):r.raw))];
    differences.push(`同一事项的日期记载分别为 ${dates.join('、')}`);
  }
  if(e.amtVals.length>1){
    differences.push(`同一事项的金额记载分别为 ${e.amtVals.map(fmtAmt).join('、')}`);
  }
  if(!differences.length && pendingReviewNote(e.f.id)) return '已填写律师复核意见，等待 AI 结合材料处理。';
  return differences.length?`${differences.join('。')}。`:'该事项的材料或争议状态需要复核。';
}
function pendingReviewNote(fid){
  const note=S.reviewNotes[fid];
  return note?.status==='pending' && !!note.text?.trim();
}
function updateReviewNote(input){
  const fid=input.dataset.fact;
  const text=input.value.trim();
  if(S.reviewNotes[fid]?.text===text) return;
  if(text) S.reviewNotes[fid]={text,status:'pending'};
  else delete S.reviewNotes[fid];
  const box=input.closest('.lawyer-note');
  box.querySelector('.note-state').textContent=text?' · 待 AI 复核':'';
  box.querySelector('.note-response')?.remove();
  const count=$('.rv .num');
  if(count) count.textContent=pendingCount();
  const status=document.getElementById('row-'+fid)?.querySelector('.review-state');
  const fact=derive().find(e=>e.id===fid);
  if(status&&fact) status.outerHTML=factReviewBadge(fact);
  const badge=box.closest('.dbody')?.querySelector('.review-banner');
  if(badge&&fact) badge.outerHTML=factReviewBadge(fact,true);
}
function reviewNoteEditor(fid){
  const note=S.reviewNotes[fid];

  return `<details class="lawyer-note" ${note?.text?'open':''}>
    <summary>填写其他复核意见<span class="note-state">${state}</span></summary>
    <textarea aria-label="律师复核意见" data-fact="${esc(fid)}" rows="4" placeholder="填写您对这条事实的理解，或指出需要再核对的位置。" oninput="updateReviewNote(this)">${esc(note?.text||'')}</textarea>

  </details>`;

function reviewFactCard(e){
  const linked=ATTN.filter(a=>a.fact===e.f.id&&docVisible(a.d));
  const suspects=e.f.recs.filter(r=>r.sus&&docVisible(r.d)&&!e.recs.some(x=>x.rid===r.rid));
  const related=suspects.concat(e.f.ctx||[],linked.flatMap(a=>[a,...a.ctx]));
  const sources=new Map();
  const seen=new Set(e.recs.map(r=>`${r.d}:${r.q}`));
  const scanPages=new Set();
  const reviewScan=r=>{
    const key=`${r.d}:${sourcePage(r)}`;
    if(scanPages.has(key)) return '';
    scanPages.add(key);
    return sourceScan(r.d,r,true);
  };
  const extra=related.filter(r=>{
    const key=`${r.d}:${r.q}`;
    if(!r.q||seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  for(const r of e.recs.concat(extra)){
    if(!sources.has(r.d)) sources.set(r.d,r);
  }
  const hasConflict=e.anyConf||e.f.reviewConflict||e.disp==='有争议';
  const choice=r=>[e.conflict&&r.p!=='none'?(r.p==='day'?fmtD(r.s):r.raw):'',e.amtConflict&&r.amt!=null?fmtAmt(r.amt):''].filter(Boolean).join(' · ');
  const type=e.conflict?(e.amtConflict?'日期冲突、金额冲突':'日期冲突'):e.amtConflict?'金额冲突':hasConflict?'记载不一致':'事实待核';
  return `<div class="review-evidence"><strong>涉及的证据</strong>
    <ul>${[...sources.values()].map(r=>`<li><button class="dref" onclick="openDoc('${r.d}','${r.rid||''}')">${esc(DOC[r.d].name)}</button>
      ${r.loc?`<div class="sub">${esc(r.loc)}</div>`:''}</li>`).join('')}</ul></div>
    <div class="rk">${type}</div><div class="rt">${esc(e.title)}</div>
    <div class="review-difference"><strong>${hasConflict?'发现的差异':'发现的待核事项'}</strong><p>${esc(factDifference(e))}</p></div>
    <div class="sec">原始记载</div>
    ${e.recs.map(r=>`<div class="cand"><strong class="record-title">${esc(DOC[r.d].name)}</strong>
      ${q({...r,qx:[]})}
      ${reviewScan(r)}
      ${r.qx?.length?`<details class="linked-checks"><summary>同份材料的其他摘录</summary>${r.qx.map(x=>`<div class="q">${esc(x)}</div>`).join('')}</details>`:''}
      ${choice(r)&&!r.loose?`<button class="btn" onclick="adopt('${e.f.id}','${r.rid}')">采用 ${esc(choice(r))}</button>`:''}</div>`).join('')}
    ${extra.map(r=>`<div class="cand"><strong class="record-title">${esc(DOC[r.d].name)}</strong>${q(r)}${reviewScan(r)}</div>`).join('')}
    ${linked.length?`<details class="linked-checks"><summary>相关复核记录</summary>${linked.map(a=>`<p>${esc(a.why)}</p>`).join('')}</details>`:''}
    ${reviewNoteEditor(e.f.id)}
    <p class="review-action-note">确认事项：${esc(e.title)}。${hasConflict?'确认后保留材料中的不同记载。':''}</p>
    <div class="ra"><button class="btn" onclick="toggleRev('${e.f.id}')">${hasConflict?'已确认，保留不同记载':'已确认'}</button>
      ${e.conflict?`<button class="lnk" onclick="cres('${e.f.id}','planned')">其中一条只是约定</button>`:''}
      ${e.anyConf?`<button class="lnk" onclick="cres('${e.f.id}','split')">拆为不同事实</button>`:''}
      <button class="lnk" onclick="selectEv('${e.id}')">查看事实</button></div>`;
}

  if(it.k==='dup'){ const g=it.g, es=g.fids.map(fid=>derive().find(e=>e.f.id===fid)||null).filter(Boolean);

     <div class="calc">${esc(r.why)}${it.sum!=null?` 加总 ${fmtAmt(it.sum)}，对照 ${fmtAmt(it.total)}，相差 ${fmtAmt(Math.abs(it.sum-it.total))}。`:''}</div>

    return `<div class="rk infk">推断日期 · ${INFER[it.key].n}</div><div class="rt">${it.fs.length} 个事实用到这一推断</div>
     ${it.fs.map(e=>`<div class="npr"><span><span class="d">${dateLabel(e)}</span>　${esc(e.title)}</span><button class="dref" onclick="selectEv('${e.id}')">查看</button></div>`).join('')}
     <div class="calc">${esc(INFER[it.key].basis)}</div>
     <div class="ra"><button class="lnk" onclick="S.inferOk['${it.key}']='undated';logIt(null,'推断改为无日期','${INFER[it.key].n}');render()">改为无日期</button><button class="btn" onclick="S.inferOk['${it.key}']='ok';logIt(null,'确认推断','${INFER[it.key].n}');render()">确认推断</button></div>`;
  }

function adopt(fid,rid){ if(!(fid in S.adopt)) S.revPrev[fid]=S.rev[fid]; S.adopt[fid]=rid; S.rev[fid]='done'; logIt(fid,'采信记载',`${REC[rid].d}「${REC[rid].raw}」`); toast(`已采信 ${REC[rid].d}「${REC[rid].raw}」，其余记载保留在底稿`); render(); }
function unAdopt(fid){ delete S.adopt[fid]; if(fid in S.revPrev){ if(S.revPrev[fid]===undefined) delete S.rev[fid]; else S.rev[fid]=S.revPrev[fid]; delete S.revPrev[fid]; } logIt(fid,'撤销采信',FACT[fid].title); render(); }
function cres(fid,v){ S.cres[fid]=v; logIt(fid,v==='split'?'拆为不同事实':'其中一条只是约定',FACT[fid].title); render(); }
function factReview(e){
  const dateDiff=e.wasConflict||e.conflict;
  const amountDiff=e.amtVals.length>1;
  const note=e.f.cnote;
  if(!dateDiff&&!amountDiff&&!note&&e.disp!=='有争议') return '';
  const groups=new Map();
  for(const r of e.recs){
    const iv=dateDiff&&e.strict.includes(r)?recIv(r):null;
    const date=iv?(r.p==='day'?fmtD(r.s):r.raw):'';
    const amount=amountDiff&&r.amt!=null?fmtAmt(r.amt):'';
    const label=[date,amount].filter(Boolean).join(' · ');
    if(!label) continue;
    if(!groups.has(label)) groups.set(label,[]);
    groups.get(label).push(r);
  }
  const related=ATTN.filter(a=>a.fact===e.f.id&&docVisible(a.d));
  return `<section class="fact-focus" aria-label="复核要点">
    <strong>材料记载与差异</strong>
    <p>${esc(factDifference(e))}</p>
    ${groups.size?`<ul class="fact-compare">${[...groups].map(([label,recs])=>`<li><b>${esc(label)}</b>
      ${recs.map(r=>`<button class="dref" onclick="openDoc('${r.d}','${r.rid}')">${esc(DOC[r.d].name)}${r.loc?` · ${esc(r.loc)}`:''}</button>`).join('')}</li>`).join('')}</ul>`:''}
    ${related.length?`<details class="linked-checks"><summary>核对依据</summary>${related.map(a=>`<p>${esc(a.why)}</p><button class="dref" onclick="openDoc('${a.d}')">${esc(DOC[a.d].name)}${a.loc?` · ${esc(a.loc)}`:''}</button>`).join('')}</details>`:''}
  </section>`;
}
function factSteps(id){

function validateCase(c){
  const errs=[]; const docs=Object.fromEntries((c.materials||[]).map(d=>[d.id,d]));

  (c.facts||[]).forEach(f=>{ if(!f.id||!f.title) errs.push('事实缺编号或标题');
    (f.recs||[]).forEach((r,i)=>{ const d=docs[r.d]; if(!d){ errs.push(`${f.id} 第${i+1}条记载引用了不存在的材料 ${r.d}`); return; }
      if(r.q && !d.lines.some(l=>l.includes(r.q))) errs.push(`${f.id} 第${i+1}条记载的引语在 ${r.d} 原文里找不到（照录核验）`);
      (r.qx||[]).forEach(x=>{ if(!d.lines.some(l=>l.includes(x))) errs.push(`${f.id} 第${i+1}条记载的补充引语在 ${r.d} 原文里找不到（照录核验）`); });
      if(r.p && r.p!=='none' && !r.s) errs.push(`${f.id} 第${i+1}条记载缺日期`);
      if(r.raw && d.lines.some(l=>l.includes(r.raw)) && ![r.q,...(r.qx||[])].some(x=>x&&x.includes(r.raw))) errs.push(`${f.id} 第${i+1}条记载的引语没有包含日期原文「${r.raw}」，读者看不到日期出处`); }); });

  (c.claims||[]).forEach(x=>{ const d=docs[x.d]; if(d && x.q && !d.lines.some(l=>l.includes(x.q))) errs.push(`主张 ${x.id} 的引语在原文里找不到`); });

function verticalTimeline(evs){

    if(!months.has(month)) months.set(month,[]);
    months.get(month).push(e);
  }
  if(!months.size) return '<div class="tlempty">当前没有可按月排列的事实。</div>';
  const pending=pendingFactIds(reviewItems());
  const row=e=>{
    const date=timelineDateLabel(e);

  };

function tableFacts(){

    if(S.f.kinds.size && !e.recs.some(r=>S.f.kinds.has(dKind(r.d)))) return false;
    if(S.f.rev.size && !S.f.rev.has(e.rev)) return false;
    if(S.f.cf && S.f.cf.size && !e.recs.some(r=>S.f.cf.has(dConf(r.d)))) return false;
    if(S.f.conf && !e.wasConflict && !e.amtConflict && !(e.amtVals&&e.amtVals.length>1)) return false;
    if(S.f.key && !e.key) return false;

function readInto(f,o){ const rd=new FileReader(), txt=/^text\/|\.txt$|\.md$|\.csv$/i.test(f.type+' '+f.name);
  rd.onload=()=>{ if(txt) o.text=rd.result; else o.data=rd.result; }; txt?rd.readAsText(f,'utf-8'):rd.readAsDataURL(f); }
const pendOut=list=>list.filter(f=>f.read!==false).map(f=>({mid:f.id,name:f.name,size:f.size,kind:f.kind?KIND[f.kind].n:'',doc_date:f.date||'',status:'尚未读取',text:f.text||undefined,data:f.data||undefined}));
function saveNewBase(){
  const t=(NEW.name||'').trim()||'未命名案件';
  const base={schema:'v8-base/1',id:'case-'+Date.now().toString(36),title:t,cause:'',pack:'general',parties:[],materials:[],facts:[],claims:[],relations:[],threads:[],pending:pendOut(NEW.files)};
  saveFile(`${t}.base.json`,JSON.stringify(base,null,2),'application/json');
}
function addToCase(list){
  const fs=[...(list||[])]; if(!fs.length) return; if(!S.pend) S.pend=[];
  const nums=[...DOCS.map(d=>d.id),...S.pend.map(d=>d.id)].map(x=>+(/(\d+)$/.exec(x)||[0,0])[1]), pre=(/^([A-Z]+-)/.exec((DOCS[0]||{}).id||'L-')||[0,'L-'])[1];
  let n=Math.max(0,...nums);
  fs.forEach(f=>{ n++; const o={id:pre+String(n).padStart(2,'0'),name:f.name,size:f.size,ext:EXTN(f.name),kind:'',date:'',read:true}; S.pend.push(o); readInto(f,o); });
  render(); toast(`已加入 ${fs.length} 份材料，尚未读取`);
}
if(CASES.length) loadCase(CASES[0]); else { loadCase({id:'blank',title:'',materials:[],facts:[]}); S.view='new'; }
render();

</script></body></html>
