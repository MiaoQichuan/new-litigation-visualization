name: checks

# 每次 push 或 PR 自动跑全部回归检查（零第三方依赖，仅需 Python + graphviz）。
on:
  push:
  pull_request:

jobs:
  run-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install graphviz (needed by flowchart / relationship layouts)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      # Pillow is a TEST-ONLY dependency. Nothing in the render path imports it —
      # the zero-dependency rule still holds for producing a figure. It is needed
      # by the handful of guards that MEASURE a rendered image (edge weights,
      # label typography), and those guards skip themselves when it is absent,
      # so a contributor without it still gets a green run — just a less thorough one.
      - name: Install Pillow (test-only; the render path stays stdlib)
        run: python -m pip install --quiet pillow

      # Also test-only. Without a CJK face the guards that measure the mode
      # labels on the comparison images cannot draw anything to measure, so they
      # skip — a green run that checked less. Installing it makes them real.
      - name: Install CJK fonts (test-only)
        run: sudo apt-get install -y fonts-noto-cjk

      # run_checks.py resolves every path from its own __file__, so it can be
      # invoked from the repository root without a working-directory change.
      # One line per skill; add the next skill's entry beside these.
      - name: Run regression · mqc-litigation-visual-redraw
        run: python plugins/mqc-nlv/skills/mqc-litigation-visual-redraw/tests/run_checks.py

      - name: Run regression · mqc-timeline-master
        run: python plugins/mqc-nlv/skills/mqc-timeline-master/tests/run_checks.py
