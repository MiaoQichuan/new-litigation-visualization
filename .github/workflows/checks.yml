name: checks

# 每次 push 或 PR 自动跑全部回归检查（零第三方依赖，仅需 Python + graphviz）。
on:
  push:
  pull_request:

# 同一分支上连推几次时，取消还在跑的旧任务：省时间，也避免旧任务超时红一次。
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-checks:
    # **钉死镜像，不用 ubuntu-latest。** latest 是移动靶：GitHub 换一次镜像，
    # LibreOffice / poppler / node / Python 的版本会一起变，包名偶尔也变 ——
    # 于是代码一个字没动、CI 却红了。前后红过五轮，根因全是这一类。
    # 钉死之后升级由我们挑时间做，而不是它挑时间。
    runs-on: ubuntu-24.04
    # 装依赖几分钟；回归跑两遍（UTF-8 一遍、模拟中文 Windows 的 GBK 一遍），各约五分钟。
    # 40 分钟还没完就是卡住了，不该让它空转到六小时。
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 同上：'3.x' 也是移动靶。钉一个具体的小版本。
          python-version: '3.12'

      - name: Install graphviz (needed by flowchart / relationship layouts)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      # Pillow is a TEST-ONLY dependency. Nothing in the render path imports it —
      # the zero-dependency rule still holds for producing a figure. It is needed
      # by the handful of guards that MEASURE a rendered image (edge weights,
      # label typography), and those guards skip themselves when it is absent,
      # so a contributor without it still gets a green run — just a less thorough one.
      - name: Install Pillow (test-only; the render path stays stdlib)
        run: python -m pip install --quiet pillow

      # Also test-only. Without a CJK face the guards that measure the mode
      # labels on the comparison images cannot draw anything to measure, so they
      # skip — a green run that checked less. Installing it makes them real.
      - name: Install CJK fonts (test-only)
        run: sudo apt-get install -y fonts-noto-cjk

      # ---- 以下三样是 mqc-timeline-master 需要的（v1 不需要，所以先前没装）----
      # 装它们而不是让守卫跳过：作者定的 —— 出 PNG、出溯源索引、探测扫描件
      # 都是这个 skill 的核心交付，CI 的绿色必须真的买到「这些能力还在」。
      # 跳过换来的绿色是假的。

      # SVG -> PNG。**装 LibreOffice 而不是 librsvg**，虽然它慢一分钟。
      # 理由在 render.py 的注释里：这个 skill 的文字全是中文，soffice + Noto
      # 渲中文可靠，而 rsvg-convert 排在候选链第一位、会抢在 soffice 之前被用，
      # 它对 CJK 的表现我**在本机装不上、验不了**（容器无网）。
      # 没验过的东西不写进 CI —— 装 librsvg 换来的一分钟，不值得拿中文渲染去赌。
      # **-draw 与 -impress 都要装。** 只装 -draw 时 CI 报
      # 「LibreOffice produced no PDF」—— 那条守卫（pptx 渲出来要与母版一致）
      # 要把 .pptx 转成 PDF 再量文字落点，而 pptx 支持在 Impress 里，不在 Draw 里。
      # -draw 只够把 SVG 转 PDF（出 PNG 那条路）。
      # poppler 提供 pdftoppm（栅格化）与 pdftotext（量文字落点，那条守卫要它）。
      - name: Install LibreOffice (draw + impress) and poppler
        run: sudo apt-get install -y libreoffice-draw libreoffice-impress poppler-utils

      # 读 .docx 与出 PDF 探测样本。两者都是 test-only：
      # 出图那条路一行都不 import 它们，零第三方依赖的口径对交付物仍然成立。
      - name: Install python-docx and reportlab (test-only)
        run: python -m pip install --quiet python-docx reportlab

      # 庭前三大法宝（V3–V5）要的：Excel 母表与分析表用 openpyxl，
      # 对抗图的中文墨迹核验用 numpy（量深色像素占比，判豆腐块）。
      # 两者都只在这三个 skill 的交付路径上，V1 / V2 仍是零第三方依赖。
      - name: Install openpyxl and numpy (needed by V3–V5)
        run: python -m pip install --quiet openpyxl numpy

      # 溯源索引（Word 三线表）由 scripts/trace_index.js 出，它 require("docx")。
      # 那是 npm 的 docx 包，本机是全局装的、仓库里没有 package.json，所以 CI 上没有 ——
      # 于是「索引文档没出来」。全局装一份，让那条守卫真的能跑。
      # **装了还不够：node 的模块查找路径里没有全局目录。**
      # CI 上撞过 —— npm install -g docx@9 装成功了，但 trace_index.js
      # require("docx") 仍报「Cannot find module」，因为 node 只找
      # ./node_modules 一路往上，不看 npm 的全局目录。
      # 要么设 NODE_PATH，要么装到工作目录。这里设 NODE_PATH（对后续步骤都生效）。
      - name: Install npm docx (needed by trace_index.js)
        run: |
          npm install -g docx@9
          echo "NODE_PATH=$(npm root -g)" >> $GITHUB_ENV

      # img2pdf：造「纯图 PDF」样本用的 —— 探测判据的**反向验证**要它
      # （扫描件必须判成 scanned；少了这一条，把探测写成「永远有字」也能通过）。
      # 与 reportlab 一样是 test-only：出图那条路一行都不 import。
      - name: Install img2pdf (test-only, scanned-PDF sample)
        run: python -m pip install --quiet img2pdf

      # run_checks.py resolves every path from its own __file__, so it can be
      # invoked from the repository root without a working-directory change.
      # One line per skill; add the next skill's entry beside these.
      # 跑回归之前先把环境摊开印一遍。**这一步不是装饰，是排障的入口。**
      # 反复踩过的那一类失败（本机有的 CI 上没有、装成功却找不到）在日志里长得都
      # 一样，看不出是哪一样漂了。有了这份清单，下次红的时候把日志开头与上次一比
      # 就知道差别在哪，不必再逐项猜。continue-on-error：它只负责报告，
      # 报告本身失败不该把整条流水线判红。
      - name: Environment inventory (diagnostic only)
        continue-on-error: true
        run: |
          echo "===== runner ====="
          uname -a; cat /etc/os-release | head -2
          echo "===== python ====="
          python --version; python -c "import sys; print(sys.executable)"
          python -m pip list 2>/dev/null | grep -Ei 'pillow|docx|reportlab|img2pdf' || true
          echo "===== external tools ====="
          # 版本参数各家不同：poppler 的 pdftoppm / pdftotext 认 -v（--version 会被
          # 当成文件名，印出 I/O Error 那种误导性的行），graphviz 的 dot 认 -V。
          # 探测方式写错，清单本身就会骗人 —— 这一步实跑核对过。
          probe() {
            printf '%-14s ' "$1"
            command -v "$1" >/dev/null 2>&1 || { echo "MISSING"; return; }
            "$1" $2 2>&1 | head -1
          }
          probe soffice --version
          probe pdftoppm -v
          probe pdftotext -v
          probe dot -V
          probe node --version
          probe npm --version
          probe rsvg-convert --version
          probe inkscape --version
          echo "NODE_PATH=$NODE_PATH"
          node -e "require.resolve('docx'); console.log('npm docx: resolvable')" 2>&1 | head -1
          echo "===== CJK fonts ====="
          fc-list | grep -ci "CJK" || echo 0
          echo "===== doctor.py (v1 kernel) ====="
          python plugins/mqc-nlv/skills/mqc-litigation-visual-redraw/scripts/doctor.py || true

      - name: Run regression · mqc-litigation-visual-redraw
        run: python plugins/mqc-nlv/skills/mqc-litigation-visual-redraw/tests/run_checks.py

      - name: Run regression · mqc-timeline-master
        run: python plugins/mqc-nlv/skills/mqc-timeline-master/tests/run_checks.py

      # V3–V5 的回归此前没进 CI，于是这三个 skill 的改动没有守门人。
      # 一并跑。export_checks 暂不纳入：它有 4 项自开源前就未过（special-chars 与
      # dense15 三种风格），与本轮改动无关，纳入会让 CI 长期红着、失去意义；
      # 单独列为已知问题，修好再加进来。
      - name: Run regression · mqc-legal-relation-master (make + layout)
        run: |
          python plugins/mqc-nlv/skills/mqc-legal-relation-master/tests/make_checks.py
          python plugins/mqc-nlv/skills/mqc-legal-relation-master/tests/layout_regression.py

      - name: Run regression · mqc-chronicle-master
        run: python plugins/mqc-nlv/skills/mqc-chronicle-master/tests/run_checks.py

      # V6 只需标准库与 V1 内核；PPTX 回读与改坏验证都在 run_checks 里。
      # 发版闸门 = 回归 + 判定账与成品账 + 变形测试 + 令牌 + 版本一致 + 单独安装包包内回归 + 测试只增不减。
      - name: Release gate · mqc-legal-chart-master
        # 不过时把不过的那几行标到检查结果上（Annotations），不必下载整份日志就看得到原因
        run: |
          set -o pipefail
          python plugins/mqc-nlv/skills/mqc-legal-chart-master/tests/release_gate.py 2>&1 | tee gate.log || {
            grep -a -E "不过|FAIL|未过|Traceback|Error" gate.log | head -20 | sed 's/^/::error title=V6 发版闸门::/'
            exit 1
          }

      # V7 只读 V1 / V6；回归最后比对 V1–V6 的指纹，确认一个字节没被改。
      - name: Run regression · mqc-legal-courseware-master
        run: python plugins/mqc-nlv/skills/mqc-legal-courseware-master/tests/run_checks.py

      - name: Run regression · mqc-trial-confrontation-master
        run: |
          python plugins/mqc-nlv/skills/mqc-trial-confrontation-master/tests/shape_checks.py
          python plugins/mqc-nlv/skills/mqc-trial-confrontation-master/tests/break_tests.py
          python plugins/mqc-nlv/skills/mqc-trial-confrontation-master/tests/coverage_checks.py
          python plugins/mqc-nlv/skills/mqc-trial-confrontation-master/tests/palette_checks.py
          python plugins/mqc-nlv/skills/mqc-trial-confrontation-master/tests/ingest_checks.py

      # 用户大多在中文 Windows 上：不写编码时，Python 按系统区域设置读写，那里是 GBK。
      # 积成（案图）在 Windows 上跑 CI；我们这里在 Linux 上造一个 GBK 区域设置，把同一套回归再跑一遍
      # （0.9.8 第六轮这样跑出过四处真问题：法律图表大师的输出不是 UTF-8、生僻字让它崩掉，
      # 时间轴大师把写好的 Word 报成没写成，读 PDF 解码出错，审计脚本读不了自己画的 SVG）。
      # 它模拟的是「编码」，不是 Windows 的路径与命令行（那两样在 Windows 上是 Unicode，这里不是），
      # 所以测试里传中文都走文件、不走命令行参数。造不出 GBK 就直接判红：跳过换来的绿色是假的。
      - name: Re-run regression under a Chinese-Windows code page (GBK)
        env:
          LC_ALL: zh_CN.GBK
          LOCPATH: ${{ runner.temp }}/locale
        run: |
          sudo apt-get install -y locales      # localedef 与 zh_CN 的定义在这个包里（镜像一般已装，装一次不花时间）
          mkdir -p "$LOCPATH"
          LC_ALL=C localedef -i zh_CN -f GBK "$LOCPATH/zh_CN.GBK" || true
          python -c "import locale,sys; e=locale.getpreferredencoding(False); print('locale encoding:', e); sys.exit(e.lower()!='gbk')"
          S=plugins/mqc-nlv/skills
          python $S/mqc-litigation-visual-redraw/tests/run_checks.py
          python $S/mqc-timeline-master/tests/run_checks.py
          python $S/mqc-legal-relation-master/tests/make_checks.py
          python $S/mqc-legal-relation-master/tests/layout_regression.py
          python $S/mqc-chronicle-master/tests/run_checks.py
          python $S/mqc-legal-chart-master/tests/run_checks.py
          python $S/mqc-legal-courseware-master/tests/run_checks.py
          for t in shape_checks break_tests coverage_checks palette_checks ingest_checks; do
            python $S/mqc-trial-confrontation-master/tests/$t.py
          done

  # V6 在别的 Python 版本上也要出一模一样的图（开源前实跑抓到过 3.11 与 3.12+ 字宽不同，
  # 3.9 是环境自检里写明的最低版本：写了就要真测；
  # 横条名被拆成两行）。只需标准库与仓库里的 V1 内核，不装任何系统包，所以很快。
  # 成品账逐字节比对，版本一换图就变的话这里会红。
  v6-python-versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Regression · mqc-legal-chart-master (stdlib only)
        run: python plugins/mqc-nlv/skills/mqc-legal-chart-master/tests/run_checks.py
